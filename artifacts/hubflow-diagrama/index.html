<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Diagrama HubFlow</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#eef1f5;
    --surface:#ffffff;
    --border:#b7c2cd;
    --border-strong:#849aab;
    --fg:#1b2530;
    --muted:#5c6b7a;
    --accent:#b85c1c;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#11161c; --surface:#1a222b; --border:#36434f;
      --border-strong:#57697a; --fg:#e6edf4; --muted:#93a4b4; --accent:#e2903f;
    }
  }
  :root[data-theme="dark"]{
    --bg:#11161c; --surface:#1a222b; --border:#36434f;
    --border-strong:#57697a; --fg:#e6edf4; --muted:#93a4b4; --accent:#e2903f;
  }

  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    padding:36px 20px 56px;
  }
  .wrap{ max-width:1100px; margin:0 auto; }
  h1{ font-size:22px; font-weight:600; letter-spacing:-.01em; margin:0 0 6px; text-wrap:balance; }
  p.lede{ max-width:70ch; color:var(--muted); font-size:14.5px; line-height:1.55; margin:0 0 24px; }

  .diagram-card{
    background:var(--surface); border:1px solid var(--border-strong);
    border-radius:10px; padding:20px; overflow-x:auto;
  }
  .diagram-card pre.mermaid{ margin:0; }

  .legend{
    display:flex; flex-wrap:wrap; gap:22px; margin-top:18px;
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--muted);
  }
  .legend span{ display:inline-flex; align-items:center; gap:8px; }
  .swatch{ width:26px; height:2px; background:var(--fg); display:inline-block; }
  .swatch.owns{ background:var(--accent); height:3px; }
  .swatch.dep{ background:none; border-top:2px dashed var(--muted); height:0; }

  figcaption{
    max-width:78ch; margin:20px 0 0; color:var(--muted); font-size:13px; line-height:1.6;
  }
  figcaption b{ color:var(--fg); font-weight:600; }
  .hint{
    max-width:78ch; margin:22px 0 0; padding-top:16px;
    border-top:1px solid var(--border); color:var(--muted); font-size:12.5px;
  }
</style>

<div class="wrap">
  <h1>Diagrama de clases, estructuras y punteros — HubFlow</h1>
  <p class="lede">
    Clases principales, los nodos que arma cada lista propia, y quién es dueño de qué:
    <code>ListaDeEnvios</code> posee los <code>Envio*</code>, <code>ListaPendientes</code> solo los referencia,
    y cada <code>Envio</code> compone su propio historial doblemente enlazado.
  </p>

  <figure>
    <div class="diagram-card">
<pre class="mermaid">
classDiagram
    class CentroDeDistribucion {
        -ListaDeEnvios registro
        -ListaPendientes pendientes
        +registrarEnvio(cod, dest, zona, peso, nivel)
        +despacharProximo()
        +reprogramarEnvio(codigo, motivo)
        +cambiarEstado(codigo, estado, obs)
    }

    class ListaDeEnvios {
        -NodoEnvio* comienzo
        -NodoEnvio* ultimo
        +agregar(Envio* e)
        +buscar(codigo) Envio*
    }

    class NodoEnvio {
        +Envio* envio
        +NodoEnvio* siguiente
    }

    class ListaPendientes {
        -NodoPendiente* comienzo
        +agregar(Envio* e)
        +despachar() Envio*
        +remover(Envio* e)
    }

    class NodoPendiente {
        +Envio* envio
        +NodoPendiente* siguiente
    }

    class Envio {
        -string codigo
        -string zona
        -NivelServicio nivel
        -Estado estado
        -HistorialDeMovimientos historial
        +cambiarEstado(estado, obs)
    }

    class HistorialDeMovimientos {
        -NodoMovimiento* cabeza
        -NodoMovimiento* cola
        +agregarMovimiento(estado, obs)
    }

    class NodoMovimiento {
        +Movimiento* movimiento
        +NodoMovimiento* siguiente
        +NodoMovimiento* anterior
    }

    class Movimiento {
        +int numero
        +string estado
        +string observacion
    }

    CentroDeDistribucion *-- ListaDeEnvios : registro
    CentroDeDistribucion *-- ListaPendientes : pendientes
    ListaDeEnvios "1" *-- "0..*" NodoEnvio : dueña de sus nodos
    NodoEnvio --> NodoEnvio : siguiente
    NodoEnvio --> Envio : dueño, hace delete
    ListaPendientes "1" *-- "0..*" NodoPendiente : dueña de sus nodos
    NodoPendiente --> NodoPendiente : siguiente
    NodoPendiente ..> Envio : referencia, no destruye
    Envio *-- HistorialDeMovimientos : historial
    HistorialDeMovimientos "1" *-- "0..*" NodoMovimiento : dueña de sus nodos
    NodoMovimiento --> NodoMovimiento : siguiente / anterior
    NodoMovimiento --> Movimiento : dueño, hace delete
</pre>
    </div>

    <div class="legend">
      <span><span class="swatch owns"></span>flecha gruesa = es dueño (hace <code>delete</code>)</span>
      <span><span class="swatch dep"></span>flecha punteada = referencia (no destruye)</span>
      <span>◆ diamante = composición (miembro por valor)</span>
    </div>

    <figcaption>
      <b>ListaDeEnvios</b> crea y destruye los objetos <b>Envio</b> (borrado en cascada en su destructor).
      <b>ListaPendientes</b> es una cola de prioridad que solo los referencia: cuando un envío se despacha,
      su nodo sale de <b>ListaPendientes</b> pero el <b>Envio</b> sigue vivo — porque el dueño real es
      <b>ListaDeEnvios</b>. Cada <b>Envio</b> compone su propio <b>HistorialDeMovimientos</b>
      (lista doblemente enlazada, dueña de sus <b>Movimiento</b>).
    </figcaption>
  </figure>
</div>
