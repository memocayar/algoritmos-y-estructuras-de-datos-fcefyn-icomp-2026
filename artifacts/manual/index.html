<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AyED — Manual</title>
<style>:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel2: #eef1f5; --text: #1b2330; --muted: #5d6b7e; --line: #d9dfe7;
  --accent: #0d9488; --accent2: #c026d3; --accent-ink: #ffffff;
  --code-bg: #f1f4f8; --code-text: #1b2330;
  --ok: #15803d; --okbg: #dcfce7; --bad: #b91c1c; --badbg: #fee2e2; --warn: #b45309; --warnbg: #fef3c7; --info: #1d4ed8; --infobg: #dbeafe;
  --tk-k: #7c3aed; --tk-t: #0369a1; --tk-s: #b45309; --tk-n: #be185d; --tk-c: #6b7280;
  --cur: #fde68a; --shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 14px rgba(15,23,42,.05);
  --mono: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117; --panel: #151b24; --panel2: #1c2430; --text: #e6edf3; --muted: #8b98a9; --line: #2a3441;
    --accent: #2dd4bf; --accent2: #f472b6; --accent-ink: #06201d;
    --code-bg: #0f151d; --code-text: #e6edf3;
    --ok: #4ade80; --okbg: #12301d; --bad: #f87171; --badbg: #3a1517; --warn: #fbbf24; --warnbg: #33260a; --info: #7dd3fc; --infobg: #0f2a3d;
    --tk-k: #c4a1ff; --tk-t: #7dd3fc; --tk-s: #fdba74; --tk-n: #f9a8d4; --tk-c: #6b7a8c;
    --cur: #4a3b00; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117; --panel: #151b24; --panel2: #1c2430; --text: #e6edf3; --muted: #8b98a9; --line: #2a3441;
  --accent: #2dd4bf; --accent2: #f472b6; --accent-ink: #06201d;
  --code-bg: #0f151d; --code-text: #e6edf3;
  --ok: #4ade80; --okbg: #12301d; --bad: #f87171; --badbg: #3a1517; --warn: #fbbf24; --warnbg: #33260a; --info: #7dd3fc; --infobg: #0f2a3d;
  --tk-k: #c4a1ff; --tk-t: #7dd3fc; --tk-s: #fdba74; --tk-n: #f9a8d4; --tk-c: #6b7a8c;
  --cur: #4a3b00; --shadow: none;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--sans); }
a { color: var(--accent); }
code { font-family: var(--mono); font-size: .88em; background: var(--code-bg); padding: .1em .35em; border-radius: 5px; border: 1px solid var(--line); }
.hidden { display: none !important; }

/* ---- shell ---- */
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { font-weight: 800; letter-spacing: -.02em; color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 8px; }
.brand .logo { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: inline-block; }
.brand small { font-weight: 500; color: var(--muted); }
.topbar .sp { flex: 1; }
.pill { font-size: 13px; padding: 3px 10px; border-radius: 99px; background: var(--panel2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.iconbtn { background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 9px; padding: 6px 10px; cursor: pointer; font-size: 14px; }
main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 80px; }
.layout { display: grid; grid-template-columns: 1fr; gap: 24px; }
@media (min-width: 1000px) { .layout.withtoc { grid-template-columns: 210px minmax(0, 1fr); } }
.toc { display: none; }
@media (min-width: 1000px) { .toc { display: block; position: sticky; top: 64px; align-self: start; max-height: calc(100vh - 80px); overflow: auto; font-size: 14px; } }
.toc h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.toc a { display: block; padding: 4px 8px; border-left: 2px solid var(--line); color: var(--muted); text-decoration: none; }
.toc a:hover, .toc a.active { color: var(--text); border-left-color: var(--accent); }
.content { min-width: 0; }
.content h1 { font-size: clamp(26px, 5vw, 38px); line-height: 1.15; letter-spacing: -.03em; margin: 0 0 6px; }
.content h2 { font-size: clamp(21px, 3.5vw, 27px); margin: 44px 0 10px; letter-spacing: -.02em; padding-top: 6px; scroll-margin-top: 70px; }
.content h3 { font-size: 18px; margin: 26px 0 6px; }
.lead { color: var(--muted); font-size: 17px; margin: 0 0 18px; }
.content p, .content li { max-width: 74ch; }
.content ul, .content ol { padding-left: 22px; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 8px; }

/* ---- botones ---- */
.btn { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 9px; padding: 8px 14px; cursor: pointer; min-height: 38px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.ic { padding: 8px 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }

/* ---- código ---- */
.codeview { font: 13.5px/1.55 var(--mono); background: var(--code-bg); color: var(--code-text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 0; overflow: auto; max-height: 420px; position: relative; tab-size: 4; }
.codeblock { margin: 14px 0; }
.cbtitle { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-family: var(--mono); }
.ln { display: flex; white-space: pre; padding: 0 12px 0 0; min-width: max-content; }
.ln .no { flex: 0 0 38px; text-align: right; padding-right: 12px; color: var(--muted); opacity: .6; user-select: none; }
.ln.cur { background: var(--cur); } .ln.cur .no { opacity: 1; font-weight: 700; }
.ln.errl { background: var(--badbg); }
.tk-k { color: var(--tk-k); font-weight: 600; } .tk-t { color: var(--tk-t); } .tk-s { color: var(--tk-s); } .tk-n { color: var(--tk-n); } .tk-c { color: var(--tk-c); font-style: italic; }
textarea.editor { width: 100%; font: 13.5px/1.55 var(--mono); background: var(--code-bg); color: var(--code-text); border: 1px solid var(--line); border-radius: 10px; padding: 12px; resize: vertical; tab-size: 4; white-space: pre; overflow: auto; }
textarea.editor:focus, textarea.answer:focus { outline: 2px solid var(--accent); border-color: transparent; }
textarea.answer { width: 100%; font: 14px/1.5 var(--mono); background: var(--code-bg); color: var(--code-text); border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: vertical; }
pre.console { font: 13px/1.5 var(--mono); background: #0b0f14; color: #d1f5e8; border-radius: 10px; padding: 10px 12px; margin: 4px 0; min-height: 44px; max-height: 240px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
pre.exin, pre.exout { font: 13px/1.5 var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 0; white-space: pre-wrap; overflow: auto; }

/* ---- callouts ---- */
.callout { border-left: 4px solid var(--info); background: var(--infobg); border-radius: 8px; padding: 10px 14px; margin: 16px 0; }
.callout .ctitle { font-weight: 700; margin-bottom: 2px; }
.callout ul { margin: 4px 0; }
.callout.warn { border-color: var(--warn); background: var(--warnbg); }
.callout.exam { border-color: var(--accent2); background: color-mix(in srgb, var(--accent2) 12%, var(--panel)); }
.callout.key { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
.tablewrap { overflow-x: auto; margin: 14px 0; }
table { border-collapse: collapse; font-size: 14.5px; min-width: 100%; }
th, td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
th { background: var(--panel2); }

/* ---- stepper ---- */
.stepper { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; margin: 18px 0; overflow: hidden; box-shadow: var(--shadow); }
.sthead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; background: var(--panel2); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sttitle { font-weight: 700; font-size: 14px; }
.sttools { display: flex; gap: 6px; }
.stbody { padding: 12px; }
.stnote { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
.stgrid { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 1100px) { .stgrid { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); } .stgrid .codeview { max-height: 520px; } }
.controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 10px 0 4px; }
.stepinfo { font-size: 13px; color: var(--muted); margin-left: auto; }
.slider { width: 100%; accent-color: var(--accent); }
.contitle { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 12px; }
.banner { border-radius: 10px; padding: 10px 12px; margin: 8px 0; font-size: 14.5px; }
.banner.err { background: var(--badbg); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); }
.banner.ok { background: var(--okbg); color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent); }
.banner.warn { background: var(--warnbg); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.banner.hidden { display: none; }
.empty { color: var(--muted); font-size: 13px; font-style: italic; padding: 4px 2px; }
.hint { font-size: 13px; color: var(--muted); }

/* ---- visualizador de memoria ---- */
.vizroot { position: relative; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px; overflow: auto; }
.arrows { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 5; }
.vizgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 34px; position: relative; z-index: 1; }
@media (max-width: 620px) { .vizgrid { gap: 22px; } }
.col { min-width: 0; }
.coltitle { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 6px; }
.coltitle small { text-transform: none; letter-spacing: 0; font-weight: 400; }
.frame { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
.frame.top { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.fhead { background: var(--panel2); font: 600 12.5px var(--mono); padding: 4px 10px; }
.vrow { display: flex; align-items: center; gap: 8px; padding: 4px 10px; flex-wrap: wrap; border-top: 1px dashed var(--line); }
.vrow:first-of-type { border-top: 0; }
.vrow.shadow { opacity: .45; }
.vname { font: 600 13px var(--mono); min-width: 54px; display: flex; flex-direction: column; }
.vname small { font: 400 10.5px var(--mono); color: var(--muted); }
.cell { display: inline-flex; align-items: center; gap: 6px; font: 600 13px var(--mono); border: 1.5px solid var(--line); background: var(--code-bg); border-radius: 6px; padding: 2px 8px; min-width: 34px; min-height: 26px; justify-content: center; }
.cell.uninit { color: var(--muted); border-style: dashed; }
.cell.chg { animation: flash 1.1s ease-out; border-color: var(--accent); }
@keyframes flash { 0% { background: var(--cur); } 100% { background: var(--code-bg); } }
.cell.ptr { border-color: var(--pc, var(--line)); background: color-mix(in srgb, var(--pc, transparent) 14%, var(--code-bg)); }
.cell.ptr .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); display: inline-block; }
.cell.ptr .addr { font-size: 11px; font-weight: 500; opacity: .85; }
.cell.ptr .pstr { color: var(--tk-s); font-weight: 500; }
.cell.ptr.null { border-style: dotted; color: var(--muted); }
.cell.ptr.bad { border-color: var(--bad); }
.cell.ptr.bad .addr { color: var(--bad); text-decoration: underline wavy; }
.obj { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; min-width: 120px; }
.objhead { font: 600 11.5px var(--mono); background: var(--panel2); padding: 2px 8px; color: var(--muted); }
.frow { display: flex; align-items: center; gap: 8px; padding: 3px 8px; border-top: 1px dashed var(--line); }
.frow:first-of-type { border-top: 0; }
.fname { font: 500 12.5px var(--mono); min-width: 52px; color: var(--muted); }
.arr .acells { display: flex; flex-wrap: wrap; gap: 0; }
.acell { display: inline-flex; flex-direction: column; align-items: center; }
.acell .cell { border-radius: 0; margin-left: -1.5px; }
.idx { font: 10.5px var(--mono); color: var(--muted); }
.more { font: 12px var(--mono); color: var(--muted); align-self: center; padding: 0 6px; }
.arrstr { font: 12px var(--mono); color: var(--tk-s); margin-top: 2px; }
.block { border: 1.5px solid var(--accent2); background: var(--panel); border-radius: 10px; margin-bottom: 8px; padding-bottom: 6px; }
.block > .obj, .block > .arr, .block > .cell { margin: 6px 8px 0; }
.block.new { animation: pop .5s ease-out; }
@keyframes pop { from { transform: scale(.96); opacity: .3; } to { transform: none; opacity: 1; } }
.block.dead { border-color: var(--bad); border-style: dashed; opacity: .6; }
.bhead { display: flex; gap: 8px; align-items: center; background: color-mix(in srgb, var(--accent2) 14%, var(--panel)); padding: 3px 10px; border-radius: 8px 8px 0 0; font: 12px var(--mono); flex-wrap: wrap; }
.baddr { color: var(--muted); }
.blabel { font-weight: 700; }
.freed { margin-left: auto; color: var(--bad); font-weight: 700; }

/* ---- preguntas y ejercicios ---- */
.q { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 14px; margin: 18px 0; box-shadow: var(--shadow); }
.qhead { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.qtag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--accent2); }
.qtitle { font-weight: 700; }
.qdone { color: var(--ok); font-weight: 800; margin-left: auto; }
.qtext { margin: 8px 0; }
.opts { display: grid; gap: 8px; margin-top: 10px; }
.opt { display: flex; gap: 10px; text-align: left; font: inherit; font-size: 15px; background: var(--panel2); color: var(--text); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; align-items: flex-start; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .letter { font-weight: 800; color: var(--muted); text-transform: uppercase; flex: 0 0 auto; }
.opt.good { border-color: var(--ok); background: var(--okbg); }
.opt.bad { border-color: var(--bad); background: var(--badbg); }
.opt:disabled { cursor: default; color: var(--text); }
.feedback { margin-top: 10px; padding: 10px 12px; border-radius: 10px; }
.feedback.ok { background: var(--okbg); } .feedback.no { background: var(--badbg); }
.examples { margin: 10px 0; }
.extitle { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 4px; }
.exrow { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 8px; }
@media (min-width: 720px) { .exrow { grid-template-columns: 3fr 2fr; } }
.trow { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 8px 0; }
.trow.ok { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
.trow.no { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
.thead { font-weight: 600; display: flex; gap: 8px; }
.trow.ok .mark { color: var(--ok); } .trow.no .mark { color: var(--bad); }
.cmp { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 6px; }
@media (min-width: 720px) { .cmp { grid-template-columns: 1fr 1fr; } }
.lbl { font-size: 12px; color: var(--muted); }
pre.console.got { border: 1px solid var(--bad); }
.errmsg { margin: 6px 0; color: var(--bad); }
details.solution { margin-top: 12px; border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; }
details.solution summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.solbody { margin-top: 8px; }

/* ---- home ---- */
.hero { padding: 26px 0 8px; }
.hero h1 { font-size: clamp(30px, 6vw, 46px); margin: 0 0 8px; }
.grad { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.countdown { display: inline-flex; align-items: baseline; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; margin: 10px 0; box-shadow: var(--shadow); }
.countdown .n { font-size: 34px; font-weight: 800; color: var(--accent2); line-height: 1; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin: 14px 0; }
.card { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-decoration: none; color: inherit; box-shadow: var(--shadow); position: relative; }
a.card:hover { border-color: var(--accent); }
.card h3 { margin: 4px 0 4px; font-size: 18px; }
.card p { margin: 0 0 8px; color: var(--muted); font-size: 14.5px; }
.card .num { font: 700 12px var(--mono); color: var(--accent2); }
.card.soon { opacity: .6; }
.bar { height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.chip { font-size: 13px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); }
.chip.in { border-color: var(--ok); color: var(--ok); } .chip.out { border-color: var(--muted); color: var(--muted); text-decoration: line-through; }
.timeline { display: grid; gap: 10px; margin: 12px 0; }
.day { display: grid; grid-template-columns: 74px 1fr; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.day .d { font-weight: 800; color: var(--accent2); font-size: 14px; }
.day .d small { display: block; color: var(--muted); font-weight: 500; }
.day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.modnav { display: flex; justify-content: space-between; gap: 10px; margin-top: 44px; flex-wrap: wrap; }
.footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 50px; }
@media (max-width: 620px) { .day { grid-template-columns: 60px 1fr; } .ln .no { flex-basis: 30px; } main { padding-inline: 12px; } }

.heapcol { padding-right: 34px; }
.frame.elided { border-style: dashed; background: transparent; text-align: center; } .frame.elided .empty { padding: 8px; }

.timerbox { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; margin: 14px 0; text-align: center; }
.timerbox .tlabel { color: var(--muted); font-size: 13px; }
.timerbox .clock { font-family: var(--mono); font-size: 40px; font-weight: 700; letter-spacing: 2px; margin: 4px 0 8px; }
.timerbox.low .clock { color: var(--warn); }
.timerbox.over .clock { color: var(--bad); }
.timerbox .row { justify-content: center; }
.progbox { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 10px 14px; margin: 12px 0; font-size: 14.5px; }
.progbox .bar { height: 8px; border-radius: 6px; background: var(--panel2); margin-top: 6px; overflow: hidden; }
.progbox .fill { height: 100%; background: var(--accent); transition: width .3s; }
</style></head>

class exception {
public:
  exception() {}
  virtual ~exception() {}
  virtual const char* what() const { return "std::exception"; }
};
class logic_error : public exception {
  string m_msg;
public:
  logic_error(const string& m) : m_msg(m) {}
  logic_error(const char* m) : m_msg(m) {}
  const char* what() const { return m_msg.c_str(); }
};
class runtime_error : public exception {
  string m_msg;
public:
  runtime_error(const string& m) : m_msg(m) {}
  runtime_error(const char* m) : m_msg(m) {}
  const char* what() const { return m_msg.c_str(); }
};
class underflow_error : public runtime_error {
public:
  underflow_error(const string& m) : runtime_error(m) {}
  underflow_error(const char* m) : runtime_error(m) {}
};
class overflow_error : public runtime_error {
public:
  overflow_error(const string& m) : runtime_error(m) {}
  overflow_error(const char* m) : runtime_error(m) {}
};
class out_of_range : public logic_error {
public:
  out_of_range(const string& m) : logic_error(m) {}
  out_of_range(const char* m) : logic_error(m) {}
};
class invalid_argument : public logic_error {
public:
  invalid_argument(const string& m) : logic_error(m) {}
  invalid_argument(const char* m) : logic_error(m) {}
};
class length_error : public logic_error {
public:
  length_error(const string& m) : logic_error(m) {}
  length_error(const char* m) : logic_error(m) {}
};
class domain_error : public logic_error {
public:
  domain_error(const string& m) : logic_error(m) {}
  domain_error(const char* m) : logic_error(m) {}
};

template <typename T>
class initializer_list {
  const T* m_d;
  size_t m_n;
public:
  initializer_list(const T* d, size_t n) : m_d(d), m_n(n) {}
  const T* begin() const { return m_d; }
  const T* end() const { return m_d + m_n; }
  size_t size() const { return m_n; }
};

template <typename T> void swap(T& a, T& b) { T t = a; a = b; b = t; }
template <typename T> T max(const T& a, const T& b) { return a < b ? b : a; }
template <typename T> T min(const T& a, const T& b) { return b < a ? b : a; }

template <typename T>

  T* m_data;
  size_t m_size;

("div.errmsg",u("strong","Fuga de memoria: "),`la salida es correcta pero quedaron ${n.leaks.length} bloque(s) sin liberar (${n.leaks.map(s=>s.label).join(", ")}). Cada new necesita su delete.`)):n.hidden||o.append(u("div.cmp",u("div",u("div.lbl","Esperado"),u("pre.console",n.expected)),u("div",u("div.lbl","Obtenido"),u("pre.console.got",n.got))));e.append(o)}),e}function Dt(l){let i=(l.minutes||90)*60,t=i,e=null,a=u("div.clock",""),n=d=>String(Math.floor(d/60)).padStart(2,"0")+":"+String(d%60).padStart(2,"0"),r=u("div.timerbox"),o=()=>{a.textContent=n(Math.max(0,t)),r.classList.toggle("low",t<=300&&t>0),r.classList.toggle("over",t<=0)},s=u("button.btn.primary",{type:"button",onclick:()=>{if(e){clearInterval(e),e=null,s.textContent="▶ Seguir";return}s.textContent="⏸ Pausar",e=setInterval(()=>{t--,o(),t<=0&&(clearInterval(e),e=null,s.textContent="⏱ Tiempo")},1e3)}},"▶ Empezar"),c=u("button.btn.ghost",{type:"button",onclick:()=>{clearInterval(e),e=null,t=i,s.textContent="▶ Empezar",o()}},"↺ Reiniciar");return o(),r.append(u("div.tlabel",l.label||"Cronómetro"),a,u("div.row",s,c)),r}function Ot(l){let i=u("div.progbox"),t=()=>{let e=l.ids.filter(a=>U.done.has(a)).length;i.innerHTML="",i.append(u("span",{html:T("**"+(l.label||"Avance")+":** "+e+" / "+l.ids.length)}),u("div.bar",u("div.fill",{style:"width:"+Math.round(100*e/l.ids.length)+"%"})))};return t(),document.addEventListener("progress",t),i}var rt=[{t:"note",kind:"key",title:"Qué vas a poder hacer al terminar este módulo",items:["Dibujar de memoria dónde vive cada variable (stack o heap) y qué guarda cada caja.","Leer y escribir código con `&`, `*`, `->`, `new`, `delete`, `nullptr` sin marearte.","Reconocer a simple vista los 6 errores clásicos: nullptr, puntero salvaje, puntero colgante, use-after-free, doble delete y fuga de memoria.",'Base para todo lo que sigue: una lista enlazada es "structs con punteros a otros structs".']},{t:"note",kind:"tip",title:"Cómo leer esto",text:"Cada ejemplo es un programa real que corre en tu navegador. Apretá **Siguiente ▶** y mirá cómo cambian el stack, el heap y las flechas. Podés tocar **✏️ Editar** y cambiar el código. En los ejemplos omitimos `#include <iostream>` y `using namespace std;` para que entren en pantalla."},{t:"h2",id:"s1",text:"1. La memoria es una fila de cajas numeradas"},{t:"p",text:"Cuando escribís `int a = 10;` el programa reserva 4 bytes en la RAM y a esa caja le pone el nombre `a`. Cada caja tiene una **dirección**: un número, como el número de una casa en una calle. En Python o Java casi nunca ves las direcciones. En C++ las manejás vos, y de ahí sale casi todo lo difícil (y lo poderoso) de la materia."},{t:"live",title:"Ejemplo 1 — cada variable es su propia caja",code:`int main() {
    int a = 10;
    int b = a;
    b = 99;
    cout << a << " " << b << endl;
}`,note:"Fijate que <code>b = a</code> <strong>copia</strong> el valor. Cambiar <code>b</code> después no toca <code>a</code>. Pasá el mouse (o mantené apretado en el celu) sobre una caja para ver su tipo y su dirección."},{t:"h3",text:"Stack y heap: dos zonas de memoria"},{t:"table",head:["","Stack (pila)","Heap (montón)"],rows:[["Quién lo maneja","Automático: el compilador","Vos: `new` y `delete`"],["Cuánto vive","Hasta que termina el bloque `{ }` o la función","Hasta que hagas `delete` (o hasta que termine el programa)"],["Qué va ahí","Variables locales, parámetros","Lo que crees con `new`"],["Tamaño","Chico (unos MB)","Enorme"],["Ejemplo","`int x = 5;`","`int* p = new int(5);`"]]},{t:"live",title:"Ejemplo 2 — el stack crece y se achica con cada llamada",code:`int doble(int n) {
    int r = n * 2;
    return r;
}
int main() {
    int x = 4;
    int y = doble(x);
    cout << y << endl;
}`,note:"Mirá cómo aparece un marco (frame) nuevo para <code>doble()</code> y desaparece cuando termina. Sus variables (<code>n</code>, <code>r</code>) mueren con él."},{t:"note",kind:"key",title:"Regla de oro",text:'Todo lo que declarás "a secas" (`int x;`) vive en el **stack** y se destruye solo al salir del bloque. Todo lo que creás con `new` vive en el **heap** y **solo se destruye si vos hacés `delete`**.'},{t:"h2",id:"s2",text:"2. Punteros: variables que guardan direcciones"},{t:"p",text:"Un puntero es una variable cuyo valor **es la dirección de otra variable**. Se declara con `*` y tiene dos operadores clave:"},{t:"table",head:["Símbolo","Se lee","Ejemplo"],rows:[["`&x`",'"la dirección de x"',"`int* p = &x;`  → p guarda la dirección de x"],["`*p`",'"lo que hay en la dirección p" (desreferenciar)',"`*p = 7;`  → escribe 7 en la caja a la que apunta p"],["`int* p`",'"p es un puntero a int"',"el `*` en una declaración es parte del tipo"],["`nullptr`",'"no apunto a nada"',"`int* p = nullptr;`"]]},{t:"live",title:"Ejemplo 3 — apuntar, seguir la flecha, reapuntar",code:`int main() {
    int x = 5;
    int* p = &x;
    *p = 7;
    int y = *p;
    p = nullptr;
    cout << x << " " << y << endl;
}`,note:"Cada flecha del dibujo es lo que hace el puntero: <code>*p = 7</code> sigue la flecha y cambia <code>x</code>. Al final <code>p = nullptr</code> corta la flecha."},{t:"note",kind:"warn",title:"El `*` significa dos cosas distintas",text:'En una **declaración** (`int* p`) el `*` dice "esto es un puntero". En una **expresión** (`*p = 7`) es el operador "seguí la flecha". Si te confundís, mirá si hay un tipo (`int`) a la izquierda.'},{t:"mcq",id:"m01-q1",q:"Con `int x = 5; int* p = &x; x = 9;`, ¿cuánto vale `*p`?",opts:["5, porque p se copió cuando x valía 5","9, porque p apunta a x y lee su valor actual","La dirección de x","Error de compilación"],ans:1,why:"`p` no guarda una copia del valor, guarda **dónde está** `x`. Cada vez que hacés `*p` vas a la caja y leés lo que haya ahora."},{t:"predict",id:"m01-p1",code:`int main() {
    int a = 1, b = 2;
    int* p = &a;
    int* q = &b;
    *p = *q;
    q = p;
    *q = 10;
    cout << a << " " << b << endl;
}`,why:"Paso a paso: `*p = *q` copia 2 en `a`. `q = p` hace que q apunte a `a` (a `b` no se lo toca). `*q = 10` escribe 10 en `a`."},{t:"h2",id:"s3",text:"3. Punteros y arreglos"},{t:"p",text:"Un arreglo es un bloque de cajas **pegadas una tras otra**. El nombre del arreglo, usado en una expresión, se convierte en un puntero a la primera caja. Y sumarle 1 a un puntero lo mueve **una caja del tamaño del tipo** (no un byte):"},{t:"table",head:["Escrito así","Es lo mismo que","Significa"],rows:[["`a[i]`","`*(a + i)`","el elemento i-ésimo"],["`p + 1`","—","dirección de la caja siguiente (avanza `sizeof(int)` bytes)"],["`p++`","`p = p + 1`","p ahora apunta al elemento siguiente"],["`q - p`","—","cuántos elementos hay entre las dos direcciones"]]},{t:"live",title:"Ejemplo 4 — aritmética de punteros",code:`int main() {
    int a[4] = {10, 20, 30, 40};
    int* p = a;
    p = p + 2;
    *p = 99;
    cout << a[2] << " " << *(a + 3) << " " << (p - a) << endl;
}`,note:"Las direcciones de las cajas del arreglo van de a 4 en 4 (porque es <code>int</code>). Fijate cómo <code>p + 2</code> salta dos cajas."},{t:"note",kind:"warn",title:"Un arreglo NO es un puntero",text:'`int a[4]` ocupa 16 bytes (`sizeof(a) == 16`). Un `int* p` ocupa 8 (`sizeof(p) == 8`). Al pasar un arreglo a una función "se degrada" a puntero y **pierde su tamaño**: por eso las funciones reciben `(int* a, int n)`.'},{t:"predict",id:"m01-p2",code:`int main() {
    int a[] = {5, 6, 7, 8};
    int* p = a + 1;
    cout << p[1] << " " << *p + 1 << " " << *(p + 1) << endl;
}`,why:"`p` apunta a `a[1]` (=6). `p[1]` es `a[2]` (=7). `*p + 1` es 6 + 1 = 7 (el `*` se aplica primero). `*(p+1)` es `a[2]` = 7."},{t:"h2",id:"s4",text:"4. Pasar parámetros: por valor, por puntero, por referencia"},{t:"p",text:"Por defecto C++ **copia** los argumentos. Si querés que la función modifique la variable original tenés dos herramientas: pasar un puntero (`int*`) o pasar una **referencia** (`int&`, un alias: otro nombre para la misma caja)."},{t:"live",title:'Ejemplo 5 — tres formas de "intercambiar"',code:`void swapValor(int a, int b) {
    int t = a; a = b; b = t;
}
void swapPuntero(int* a, int* b) {
    int t = *a; *a = *b; *b = t;
}
void swapRef(int& a, int& b) {
    int t = a; a = b; b = t;
}
int main() {
    int x = 1, y = 2;
    swapValor(x, y);
    cout << x << y << " ";
    swapPuntero(&x, &y);
    cout << x << y << " ";
    swapRef(x, y);
    cout << x << y << endl;
}`,note:"Avanzá hasta entrar a cada función. En <code>swapValor</code> las cajas <code>a</code> y <code>b</code> son <strong>copias</strong>. En <code>swapRef</code> los nombres <code>a</code> y <code>b</code> son alias de las cajas de <code>main</code>."},{t:"table",head:["","Puntero `T*`","Referencia `T&`"],rows:[["¿Puede ser nulo?","Sí (`nullptr`)","No, siempre apunta a algo"],["¿Se puede reapuntar?","Sí (`p = &otra`)","No, queda atada a lo que referenció al nacer"],["Sintaxis de uso","`*p`, `p->campo`","como si fuera la variable: `r`, `r.campo`"],["Al llamar","`f(&x)`","`f(x)`"]]},{t:"note",kind:"exam",title:"Lo vas a ver todo el tiempo",text:'`void enqueue(const TData& value)` es el patrón del parcial: la `&` evita copiar el objeto y el `const` promete no modificarlo. Cuando veas `const T&` pensá "lo leo sin copiarlo".'},{t:"mcq",id:"m01-q2",q:"¿Cuál de estas funciones modifica de verdad la variable `n` de quien la llama?",opts:["`void f(int n) { n = 0; }`","`void f(int& n) { n = 0; }`","`void f(const int& n) { n = 0; }`","`int f(int n) { return 0; }`"],ans:1,why:"La versión por referencia trabaja sobre la misma caja. La primera modifica una copia; la tercera ni compila (`const`); la cuarta devuelve 0 pero no toca `n`."},{t:"h2",id:"s5",text:"5. Memoria dinámica: new y delete"},{t:"p",text:"El stack se limpia solo, pero muere al salir de la función. Para datos que tienen que **sobrevivir** (una lista, una cola, un arreglo cuyo tamaño no conocés hasta que corre el programa) pedís memoria al heap con `new` y **la devolvés con `delete`**:"},{t:"table",head:["Pido","Devuelvo","Ejemplo"],rows:[["`new T(args)`","`delete p`","`int* p = new int(42);   ...   delete p;`"],["`new T[n]`","`delete[] p`","`int* a = new int[10];   ...   delete[] a;`"]]},{t:"live",title:"Ejemplo 6 — pedir y devolver memoria",code:`int main() {
    int* p = new int(42);
    int* arr = new int[3];
    for (int i = 0; i < 3; i++) {
        arr[i] = i * 10;
    }
    cout << *p << " " << arr[2] << endl;
    delete p;
    delete[] arr;
}`,note:"Los bloques violetas del heap aparecen con <code>new</code> y se marcan como <strong>liberado</strong> con <code>delete</code>. Al final mirá el cartel: sin fugas."},{t:"live",title:"Ejemplo 7 — el heap sobrevive a la función (el stack no)",code:`int* crear(int v) {
    int* p = new int(v);
    return p;
}
int main() {
    int* q = crear(8);
    cout << *q << endl;
    delete q;
}`,note:"<code>crear</code> termina y su marco desaparece, pero el <code>int</code> del heap sigue vivo porque nadie hizo <code>delete</code>. Esto es lo que usan las listas: nodos en el heap enlazados con punteros."},{t:"note",kind:"key",title:"Reglas de supervivencia",items:["Cada `new` tiene **exactamente un** `delete` (y `new[]` con `delete[]`).","Después de `delete p;` conviene hacer `p = nullptr;` (así un `delete` extra es inofensivo y un uso posterior se detecta).","Antes de usar un puntero que podría ser nulo: `if (p) { ... }`.","Quien crea la memoria tiene que saber quién la libera. Si no, fuga."]},{t:"mcq",id:"m01-q3",q:"Reservaste `int* p = new int[5];`. ¿Cómo la liberás correctamente?",opts:["`delete p;`","`delete[] p;`","`free(p);`","No hace falta: se libera al terminar la función"],ans:1,why:"`new[]` se empareja con `delete[]`. Usar `delete` a secas sobre un arreglo es comportamiento indefinido: solo destruye el primer elemento (con objetos, ni siquiera llama a los demás destructores).",wrong:{3:"Eso pasa con el stack, no con el heap. La memoria de `new` sobrevive a la función."}},{t:"h2",id:"s6",text:"6. Los errores clásicos (probalos vos)"},{t:"p",text:"Estos son los errores de memoria que aparecen en los parciales, en los tests y en el trabajo real. En C++ no hay excepciones amables: el programa simplemente hace cosas raras o se cae. Este intérprete los **detecta y te los explica**; ejecutá cada uno hasta el final."},{t:"live",title:"Error 1 — desreferenciar nullptr",code:`int main() {
    int* p = nullptr;
    cout << "antes" << endl;
    *p = 3;
    cout << "despues" << endl;
}`,note:"Un puntero nulo no apunta a ninguna caja. Seguir esa flecha = crash (segmentation fault). Solución: <code>if (p) ...</code>."},{t:"live",title:"Error 2 — puntero salvaje (sin inicializar)",code:`int main() {
    int* p;
    *p = 10;
}`,note:"Un puntero local sin inicializar tiene basura: apunta a cualquier lado. Siempre inicializá: <code>int* p = nullptr;</code>."},{t:"live",title:"Error 3 — puntero colgante (devolver la dirección de una local)",code:`int* crear() {
    int x = 42;
    return &x;
}
int main() {
    int* p = crear();
    cout << *p << endl;
}`,note:"<code>x</code> murió al salir de <code>crear()</code>. La flecha queda apuntando a una caja que ya no existe (roja, punteada)."},{t:"live",title:"Error 4 — use-after-free",code:`int main() {
    int* p = new int(5);
    delete p;
    cout << *p << endl;
}`,note:"<code>delete</code> devuelve la memoria pero <strong>no modifica <code>p</code></strong>: sigue guardando la vieja dirección (puntero colgante)."},{t:"live",title:"Error 5 — doble delete",code:`int main() {
    int* p = new int(5);
    delete p;
    delete p;
}`,note:"Liberar dos veces corrompe el heap. Con <code>p = nullptr</code> después del primer <code>delete</code>, el segundo sería inofensivo."},{t:"live",title:"Error 6 — fuga de memoria (memory leak)",code:`int main() {
    int* p = new int(5);
    p = new int(6);
    cout << *p << endl;
    delete p;
}`,note:"Al hacer <code>p = new int(6)</code> perdiste la única dirección del primer bloque: ya nadie puede liberarlo. Mirá el cartel amarillo del final."},{t:"live",title:"Error 7 — salirse del arreglo (buffer overflow)",code:`int main() {
    int v[3] = {1, 2, 3};
    for (int i = 0; i <= 3; i++) {
        cout << v[i] << " ";
    }
}`,note:"El bucle usa <code>&lt;=</code> en vez de <code>&lt;</code>. C++ no revisa los índices: <code>v[3]</code> lee memoria ajena."},{t:"table",head:["Error","Qué pasa","Cómo evitarlo"],rows:[["Desreferenciar `nullptr`","Crash","`if (p)` antes de usarlo"],["Puntero salvaje","Lee/escribe donde no debe","Inicializar siempre (`= nullptr`)"],["Puntero colgante (local)","Apunta a una variable muerta","No devolver `&local`; devolver por valor o usar el heap"],["Use-after-free","Usás memoria ya liberada","`p = nullptr` tras el `delete`"],["Doble delete","Corrupción del heap","`p = nullptr` tras el `delete`; un solo dueño"],["Fuga","La memoria nunca se libera","Un `delete` por cada `new`; liberar en destructores"],["Buffer overflow","Acceso fuera de rango","Respetar `0 .. n-1`, pasar siempre el tamaño"]]},{t:"find",id:"m01-f1",code:`int* obtener() {

int main() {
    int* p = obtener();
    cout << p[0] << endl;

    int* buf = new int[100];

int main() {
    procesar();
}`,q:"¿Cuál es el problema?",opts:["Doble delete","Fuga: en el `return` temprano nunca se llega al `delete[]`","Puntero salvaje","Buffer overflow"],ans:1,why:"Si `buf[0] == 1` la función sale antes del `delete[]` y los 400 bytes se pierden. Cada camino de salida tiene que liberar (o usar RAII: un objeto cuyo destructor libera, tema del Módulo 2)."},{t:"find",id:"m01-f3",code:`int main() {
    int* a = new int(1);

    delete a;
    delete b;
}`,q:"¿Qué pasa acá?",opts:["Nada, son dos punteros distintos","Doble delete: `a` y `b` apuntan al MISMO bloque","Fuga de memoria","Puntero nulo"],ans:1,why:"`int* b = a;` copia la dirección, no crea otro `int`. Dos punteros, un solo bloque: liberarlo dos veces es un error. (Es exactamente lo que pasa con la copia superficial de una clase con punteros: Módulo 2.)"},{t:"h2",id:"s7",text:"7. Structs y punteros: el operador ->"},{t:"p",text:"Un `struct` agrupa variables. Si tenés un puntero a un struct, para llegar a un campo hacés `(*p).campo`, que se abrevia **`p->campo`**. Y como un struct puede tener un puntero a *otro struct del mismo tipo*, podés encadenarlos: eso es una lista enlazada."},{t:"live",title:"Ejemplo 8 — dos nodos enlazados",code:`struct Nodo {
    int valor;
    Nodo* next;
    Nodo(int v, Nodo* n) : valor(v), next(n) {}
};

    Nodo* a = new Nodo(1, b);
    cout << a->valor << " " << a->next->valor << endl;

    int valor;
    Nodo* next;
    Nodo(int v, Nodo* n) : valor(v), next(n) {}
};
int main() {
    Nodo* cabeza = nullptr;
    for (int i = 3; i >= 1; i--) {
        cabeza = new Nodo(i, cabeza);
    }
    for (Nodo* p = cabeza; p != nullptr; p = p->next) {
        cout << p->valor << " ";
    }
    cout << endl;
    while (cabeza) {
        Nodo* sig = cabeza->next;
        delete cabeza;
        cabeza = sig;
    }
}`,note:"Tres patrones que vas a usar mil veces: <strong>insertar al frente</strong> (<code>cabeza = new Nodo(i, cabeza)</code>), <strong>recorrer</strong> (<code>p = p->next</code>) y <strong>liberar</strong> guardando <code>next</code> <em>antes</em> del <code>delete</code>."},{t:"note",kind:"warn",title:"Guardá `next` antes de hacer `delete`",text:"Si hacés `delete cabeza; cabeza = cabeza->next;` estás leyendo un nodo ya liberado (use-after-free). Primero `Nodo* sig = cabeza->next;`, después `delete cabeza;`."},{t:"h2",id:"s8",text:"8. const y punteros (lectura rápida)"},{t:"p",text:"Regla para leer: **de derecha a izquierda**, y el `const` afecta a lo que tiene inmediatamente a su izquierda (o a su derecha si está primero)."},{t:"table",head:["Declaración","Se lee","Qué podés hacer"],rows:[["`const int* p`","p es un puntero a int constante","reapuntar `p` sí; `*p = 3` **no**"],["`int* const p`","p es un puntero constante a int","`*p = 3` sí; reapuntar `p` **no**"],["`const int* const p`","puntero constante a int constante","ninguna de las dos"],["`const T& r`","referencia a T constante","leer sin copiar; no modificar"],["`size() const`","método que no modifica el objeto","se puede llamar sobre objetos `const`"]]},{t:"mcq",id:"m01-q4",q:"Dado `const int* p = &x;`, ¿qué línea NO compila?",opts:["`p = &y;`","`int z = *p;`","`*p = 5;`","`p = nullptr;`"],ans:2,why:"El `const` está sobre el `int` apuntado: no podés escribir a través de `p`. Sí podés cambiar hacia dónde apunta."},{t:"h2",id:"s9",text:"9. Resumen para el examen"},{t:"note",kind:"exam",title:"Hoja de ruta mental",items:["Stack = automático y efímero. Heap = manual (`new`/`delete`) y persistente.","`&x` dirección de x. `*p` valor apuntado. `p->c` campo del struct apuntado. `nullptr` = no apunta a nada.","`a[i]` es `*(a + i)`. `p + 1` avanza un elemento, no un byte.","Por valor copia; por puntero o referencia modifica el original. `const T&` = leer sin copiar.","Errores: nullptr, salvaje, colgante, use-after-free, doble delete, fuga, overflow.","Listas: guardar `next` antes de `delete`; nunca perder la cabeza (`cabeza`) sin haberla liberado."]},{t:"h2",id:"s10",text:"10. Ejercicios de código"},{t:"p",text:"Funcionan como el CodeRunner del examen: tus funciones se ejecutan contra tests (algunos ocultos) y además se verifica que **no pierdas memoria**. Si te trabás, usá **👣 Paso a paso** para ver qué hace tu código."},{t:"ex",id:"m01-e1",title:"Intercambiar por punteros",desc:"Escribí `void intercambiar(int* a, int* b)` que intercambie los valores **apuntados** por `a` y `b`.",starter:`#include <iostream>

    void set(int i, int v) { d[i] = v; }
    int get(int i) const { return d[i]; }
    int size() const { return n; }`,st=[{t:"note",kind:"key",title:"Qué vas a poder hacer al terminar este módulo",items:["Escribir una clase completa: atributos privados, constructores, destructor, métodos `const`.","Predecir en qué orden se construyen y destruyen los objetos (es pregunta clásica de examen).","Explicar y arreglar el problema de la **copia superficial** con la **Regla de 3** (y de 5).","Usar herencia con `virtual`, `override`, clases abstractas y saber por qué el destructor base tiene que ser `virtual`.","Escribir plantillas (`template <typename T>`) de funciones y de clases: la base de `Stack<TData>`, `Queue<TData>`, `DLL<TData>` del examen."]},{t:"note",kind:"tip",title:"Lo nuevo de C++",text:"Si ya viste POO en otro lenguaje, acá lo nuevo (y lo que se toma) es lo que C++ te obliga a manejar: **quién libera la memoria** de un objeto, **qué se copia** cuando copiás un objeto y **cuándo** se ejecuta cada constructor y destructor."},{t:"h2",id:"s1",text:"1. Una clase: datos + funciones que los protegen"},{t:"p",text:"Una clase agrupa **atributos** (datos) y **métodos** (funciones). Lo que declarás `private` solo lo toca la propia clase; lo `public` es la interfaz que ve el resto del programa. En un `struct` todo es público por defecto; en una `class`, todo es privado. Es la única diferencia."},{t:"live",title:"Ejemplo 1 — una clase simple",code:`class Cuenta {
    int saldo;              // privado: nadie de afuera lo toca
public:
    Cuenta(int inicial) : saldo(inicial) {}     // constructor con lista de inicialización
    void depositar(int m) { saldo += m; }
    int getSaldo() const { return saldo; }      // const: promete no modificar el objeto
};
int main() {
    Cuenta c(100);
    c.depositar(50);
    cout << c.getSaldo() << endl;
}`,note:"Cuando entrás a un método fijate en el marco: aparece <code>this</code>, un puntero al objeto sobre el que se llamó. <code>saldo += m</code> es en realidad <code>this->saldo += m</code>."},{t:"table",head:["Pieza","Qué hace","Detalle importante"],rows:[["Constructor","Se ejecuta al **crear** el objeto. Mismo nombre que la clase, sin tipo de retorno.","Usá la **lista de inicialización** (`: saldo(inicial)`): inicializa los atributos *antes* de entrar al cuerpo."],["Destructor `~Clase()`","Se ejecuta al **destruir** el objeto. Es donde liberás lo que el objeto reservó con `new`.","Uno solo, sin parámetros."],["Método `const`","`int get() const { … }` promete no modificar los atributos.","Sobre un objeto `const` (o una referencia `const`) solo se pueden llamar métodos `const`."],["`this`","Puntero al objeto actual.","Sirve para devolver `*this` (encadenar) o comparar `this != &otro`."]]},{t:"mcq",id:"m02-q1",q:"Dada `class A { int x; public: A(int v) : x(v) {} };`, ¿qué pasa con `A a(3); cout << a.x;` en `main`?",opts:["Imprime 3","Error de compilación: `x` es privado","Imprime basura","Error en tiempo de ejecución"],ans:1,why:"En una `class` los atributos son privados por defecto. Es un error **de compilación**: el programa ni siquiera se genera."},{t:"h2",id:"s2",text:"2. Constructores y destructores: cuándo se ejecutan"},{t:"p",text:"Un objeto local se **construye** en la línea donde lo declarás y se **destruye** al llegar al `}` del bloque donde vive. Si hay varios, se destruyen en **orden inverso** al de construcción (el último en nacer es el primero en morir, como una pila)."},{t:"live",title:"Ejemplo 2 — orden de vida de los objetos",code:`class Traza {
    string nombre;
public:
    Traza(const string& n) : nombre(n) { cout << "nace " << nombre << "\\n"; }
    ~Traza() { cout << "muere " << nombre << "\\n"; }
};
int main() {
    Traza a("a");
    {
        Traza b("b");
        Traza c("c");
    }
    Traza d("d");
    cout << "fin main\\n";
}`,note:'Mirá la salida: <code>c</code> muere antes que <code>b</code>, y <code>a</code> (la primera en nacer) es la última en morir, <em>después</em> de "fin main".'},{t:"predict",id:"m02-p1",code:`class Traza {
    string nombre;
public:
    Traza(const string& n) : nombre(n) { cout << "+" << nombre << " "; }
    ~Traza() { cout << "-" << nombre << " "; }
};
void f() {
    Traza x("x");
    cout << "f ";
}
int main() {
    Traza a("a");
    f();
    Traza b("b");
    cout << "fin ";
}`,why:'`a` nace; se llama a `f`: nace `x`, imprime "f ", y `x` muere al terminar `f`. Después nace `b`, "fin ", y al terminar `main` mueren en orden inverso: primero `b`, después `a`.'},{t:"h3",text:"Con herencia y composición"},{t:"p",text:"Al construir un objeto se ejecuta, en este orden: (1) los constructores de las **clases base**, (2) los constructores de los **atributos** (en el orden en que están declarados en la clase, no en el de la lista de inicialización), (3) el **cuerpo** del constructor. La destrucción es exactamente al revés."},{t:"live",title:"Ejemplo 3 — orden con herencia y un atributo objeto",code:`class Motor {
public:
    Motor() { cout << "Motor\\n"; }
    ~Motor() { cout << "~Motor\\n"; }
};
class Vehiculo {
public:
    Vehiculo() { cout << "Vehiculo\\n"; }
    virtual ~Vehiculo() { cout << "~Vehiculo\\n"; }
};
class Auto : public Vehiculo {
    Motor m;
public:
    Auto() { cout << "Auto\\n"; }
    ~Auto() { cout << "~Auto\\n"; }
};
int main() {
    Auto a;
}`,note:"Construcción: base → atributos → cuerpo. Destrucción: cuerpo → atributos → base. Simetría total."},{t:"mcq",id:"m02-q2",q:"Una clase `B` hereda de `A` y tiene un atributo `C c`. Al crear un `B`, ¿cuál es el orden de los constructores?",opts:["B, A, C","A, C, B","C, A, B","A, B, C"],ans:1,why:"Primero la base (`A`), después los atributos (`C`), al final el cuerpo del constructor de `B`. El destructor sigue el orden inverso: `~B`, `~C`, `~A`."},{t:"h2",id:"s3",text:"3. El problema: copiar un objeto que tiene punteros"},{t:"p",text:"Si no escribís nada, C++ genera un **constructor de copia** y un **operador de asignación** que copian atributo por atributo (*memberwise*). Con un `int` o un `string` está bien. Pero con un puntero se copia **la dirección**, no lo que hay del otro lado: los dos objetos quedan apuntando al **mismo** bloque. Eso es la **copia superficial** (*shallow copy*)."},{t:"p",text:"Y como cada objeto libera su bloque en el destructor… se libera **dos veces**. Este es el error central del módulo:"},{t:"live",title:"Error — copia superficial y doble delete",code:Fe+`
};
void mostrar(Buf b) {          // b es una COPIA de a (misma dirección d)
    cout << b.get(0) << endl;
}                              // muere b: delete[] d
int main() {
    Buf a(3);
    a.set(0, 7);
    mostrar(a);                // pasa por valor: se copia
    cout << "listo\\n";
}                              // muere a: delete[] d otra vez → doble delete`,note:"Mirá las dos cajas <code>d</code> (la de <code>a</code> y la de <code>b</code>): apuntan al <strong>mismo</strong> bloque del heap. Al salir de <code>mostrar</code> ese bloque se libera y <code>a</code> queda con un puntero colgante."},{t:"note",kind:"warn",title:"¿Cuándo se copia un objeto?",text:"Cuando lo **pasás por valor** a una función, cuando lo **devolvés por valor**, y cuando **inicializás** uno con otro: `Buf b = a;` o `Buf b(a);` (ojo: es *inicialización*, no asignación). Pasá por referencia (`const Buf&`) para no copiar."},{t:"h2",id:"s4",text:"4. Regla de 3 (y de 5)"},{t:"note",kind:"key",title:"Regla de 3",text:"Si una clase necesita **uno** de estos tres, casi seguro necesita **los tres**: **destructor**, **constructor de copia** y **operador de asignación**. Si tu clase hace `new` en el constructor, ya necesita destructor; por lo tanto necesita los otros dos."},{t:"table",head:["Función","Firma","Se llama cuando…","Qué tiene que hacer"],rows:[["Destructor","`~Buf()`","el objeto muere","`delete[] d;`"],["Constructor de copia","`Buf(const Buf& o)`","`Buf b = a;`, paso/retorno por valor","reservar un bloque **nuevo** y copiar los datos"],["Operador de asignación","`Buf& operator=(const Buf& o)`","`b = a;` con `b` ya existente","chequear autoasignación, reservar nuevo, copiar, **liberar el viejo**, `return *this;`"]]},{t:"live",title:"Ejemplo 4 — Regla de 3 bien hecha (copia profunda)",code:Fe+`
    Buf(const Buf& o) : d(new int[o.n]), n(o.n) {           // constructor de copia
        for (int i = 0; i < n; i++) d[i] = o.d[i];
    }
    Buf& operator=(const Buf& o) {                          // operador de asignación
        if (this != &o) {                                   // 1) ¿autoasignación (a = a)?
            int* nuevo = new int[o.n];                      // 2) reservar y copiar primero
            for (int i = 0; i < o.n; i++) nuevo[i] = o.d[i];
            delete[] d;                                     // 3) recién ahora liberar lo viejo
            d = nuevo;
            n = o.n;
        }
        return *this;                                       // 4) permitir a = b = c
    }
};
int main() {
    Buf a(3);
    a.set(0, 7);
    Buf b = a;         // constructor de copia
    b.set(0, 99);
    Buf c(1);
    c = a;             // operador de asignación
    cout << a.get(0) << " " << b.get(0) << " " << c.get(0) << " " << c.size() << endl;
}`,note:"Ahora cada objeto tiene <strong>su propio</strong> bloque en el heap. Modificar <code>b</code> no toca <code>a</code>, y no hay doble delete. Es una <strong>copia profunda</strong> (<em>deep copy</em>)."},{t:"note",kind:"tip",title:"Por qué `if (this != &o)` y por qué se libera al final",text:"Si hacés `a = a;` y liberás `d` primero, después copiás desde memoria ya liberada. Con el chequeo (o reservando antes de liberar) queda a salvo. Fijate que el operador `=` **devuelve `*this` por referencia**: eso permite `a = b = c`."},{t:"predict",id:"m02-p2",code:`class T {
public:
    T() { cout << "ctor "; }
    T(const T&) { cout << "copia "; }
    T& operator=(const T&) { cout << "asigna "; return *this; }
    ~T() { cout << "dtor "; }
};
int main() {
    T a;
    T b = a;
    T c;
    c = a;
}`,why:'`T a;` → ctor. `T b = a;` es **inicialización** → constructor de copia. `T c;` → ctor. `c = a;` ya existía → asigna. Al final mueren `c`, `b`, `a`: tres "dtor". Salida completa: `ctor copia ctor asigna dtor dtor dtor `.'},{t:"mcq",id:"m02-q3",q:"¿Cuál de estas líneas llama al **operador de asignación** (y no al constructor de copia)? Suponé `Buf a(2);`",opts:["`Buf b = a;`","`Buf b(a);`","`Buf b(1); b = a;`  (la segunda sentencia)","Pasar `a` por valor a una función"],ans:2,why:"Solo cuando el objeto de la izquierda **ya existe** se usa `operator=`. Las otras tres crean un objeto nuevo a partir de otro: constructor de copia."},{t:"h3",text:"Regla de 5: mover en vez de copiar"},{t:"p",text:'Copiar un bloque grande es caro. Cuando el origen es un objeto que está por morir (un temporal, o uno que marcás con `std::move`), conviene **robarle el puntero** en lugar de duplicar los datos. Para eso existen el **constructor de movimiento** y el **operador de asignación por movimiento** (parámetro `Clase&&`). Con ellos y los tres anteriores son 5: por eso "Regla de 5".'},{t:"live",title:"Ejemplo 5 — constructor y asignación por movimiento",code:Fe+`
    Buf(const Buf& o) : d(new int[o.n]), n(o.n) { for (int i = 0; i < n; i++) d[i] = o.d[i]; }
    Buf(Buf&& o) noexcept : d(o.d), n(o.n) {        // robar el puntero
        o.d = nullptr;                              // dejar al origen VACÍO pero válido
        o.n = 0;
    }
    Buf& operator=(Buf&& o) noexcept {
        if (this != &o) {
            delete[] d;                             // soltar lo mío
            d = o.d; n = o.n;                       // robar
            o.d = nullptr; o.n = 0;
        }
        return *this;
    }
};
int main() {
    Buf a(3);
    a.set(0, 5);
    Buf b = move(a);            // std::move: "a ya no lo necesito"
    cout << b.get(0) << " " << b.size() << " " << a.size() << endl;
}`,note:"No se copia ningún dato: el puntero <code>d</code> <strong>se transfiere</strong> de <code>a</code> a <code>b</code> y <code>a</code> queda en <code>nullptr</code> (por eso su destructor no libera nada). Después de mover, el origen no se debe usar salvo para destruirlo o reasignarlo."},{t:"note",kind:"key",title:"= default, = delete y Regla de 0",items:["`Clase(const Clase&) = delete;` prohíbe copiar (útil si copiar no tiene sentido).","`~Clase() = default;` le pide al compilador la versión por defecto.","**Regla de 0**: si tu clase usa `string`, `vector`, etc. (que ya se cuidan solos) en vez de punteros crudos, no escribas ninguna de las 5: las generadas funcionan bien."]},{t:"h2",id:"s5",text:"5. RAII: que el destructor haga la limpieza"},{t:"p",text:"En el Módulo 1 viste que un `return` temprano deja fugas. **RAII** (*Resource Acquisition Is Initialization*) es la solución: el objeto **adquiere** el recurso en su constructor y lo **libera** en su destructor. Como el destructor se ejecuta **siempre** al salir del bloque (por `return`, por el final, o por una excepción), nunca se olvida."},{t:"live",title:"Ejemplo 6 — RAII: cero fugas aunque haya return temprano",code:`class Arreglo {
    int* d;
public:
    Arreglo(int n) : d(new int[n]) { cout << "reservo\\n"; }
    ~Arreglo() { delete[] d; cout << "libero\\n"; }
    int* datos() { return d; }
};
int procesar(int x) {
    Arreglo buf(10);
    buf.datos()[0] = x;
    if (x > 5) {
        return -1;               // salida temprana: el destructor libera igual
    }
    return buf.datos()[0];
}
int main() {
    cout << procesar(9) << endl;
    cout << procesar(2) << endl;
}`,note:"Compará con el <code>find</code> del Módulo 1 (fuga por <code>return</code> temprano): acá <code>buf</code> es una variable local, su destructor corre <strong>en los dos caminos</strong>."},{t:"h2",id:"s6",text:"6. Herencia, virtual y clases abstractas"},{t:"p",text:"Con `class Perro : public Animal` un `Perro` **es un** `Animal`: hereda sus atributos y métodos. Entonces un puntero (o referencia) a `Animal` puede apuntar a un `Perro`. La pregunta clave es: si llamo un método por ese puntero, ¿se ejecuta la versión de `Animal` o la de `Perro`?"},{t:"live",title:"Ejemplo 7 — SIN virtual: manda el tipo del puntero",code:`class Animal {
public:
    void hablar() const { cout << "...\\n"; }
};
class Perro : public Animal {
public:
    void hablar() const { cout << "guau\\n"; }
};
int main() {
    Perro p;
    Animal* a = &p;
    a->hablar();        // ¿cuál?
    p.hablar();
}`,note:"Sin <code>virtual</code> el compilador decide <strong>en compilación</strong> mirando el tipo del puntero (<code>Animal*</code>) → llama a <code>Animal::hablar</code>. Se llama <em>enlace estático</em>."},{t:"live",title:"Ejemplo 8 — CON virtual: manda el objeto real (polimorfismo)",code:`class Animal {
public:
    virtual void hablar() const { cout << "...\\n"; }
    virtual ~Animal() {}
};
class Perro : public Animal {
public:
    void hablar() const override { cout << "guau\\n"; }
};
class Gato : public Animal {
public:
    void hablar() const override { cout << "miau\\n"; }
};
int main() {
    Animal* zoo[2];
    zoo[0] = new Perro();
    zoo[1] = new Gato();
    for (int i = 0; i < 2; i++) zoo[i]->hablar();
    for (int i = 0; i < 2; i++) delete zoo[i];
}`,note:"Con <code>virtual</code>, cada objeto lleva un puntero oculto a su tabla de funciones (<em>vptr</em>): en ejecución se decide cuál llamar según el <strong>tipo dinámico</strong> (fijate en el título de cada objeto del heap). <code>override</code> le pide al compilador que verifique que de verdad estás sobrescribiendo algo."},{t:"note",kind:"key",title:"Clase abstracta",text:"Un método `virtual int area() const = 0;` es **virtual puro**: no tiene implementación en la base. Una clase con al menos uno es **abstracta**: no se puede instanciar (`Forma f;` no compila), solo sirve como interfaz. Las derivadas están **obligadas** a implementarlo para poder crear objetos."},{t:"h3",text:"El destructor base tiene que ser virtual"},{t:"live",title:"Trampa — destructor no virtual y fuga",allowLeak:!0,code:`class Base {
public:
    ~Base() { cout << "~Base\\n"; }         // NO es virtual
};
class Derivada : public Base {
    int* datos;
public:
    Derivada() : datos(new int[10]) {}
    ~Derivada() { delete[] datos; cout << "~Derivada\\n"; }
};
int main() {
    Base* b = new Derivada();
    delete b;                             // ¿a quién destruye?
}`,note:"Como el destructor no es <code>virtual</code>, <code>delete b</code> solo ejecuta <code>~Base</code>. <code>~Derivada</code> nunca corre y el arreglo <code>datos</code> se pierde (fuga). En C++ es además comportamiento indefinido. <strong>Arreglo:</strong> <code>virtual ~Base() {}</code>."},{t:"note",kind:"warn",title:"Slicing (rebanado)",text:"Si asignás un objeto derivado a una variable **por valor** de tipo base (`Animal a = perro;`) se copia solo la parte `Animal` y se pierde el resto (¡y el polimorfismo!). Para polimorfismo usá **punteros o referencias** a la base."},{t:"live",title:"Ejemplo 9 — slicing: el objeto pierde su parte derivada",code:`class Animal {
public:
    virtual void hablar() const { cout << "animal\\n"; }
};
class Perro : public Animal {
public:
    void hablar() const override { cout << "guau\\n"; }
};
int main() {
    Perro p;
    Animal& ref = p;      // referencia: mantiene el Perro
    Animal copia = p;     // copia POR VALOR: solo queda la parte Animal
    ref.hablar();
    copia.hablar();
}`,note:"<code>copia</code> es un <code>Animal</code> de verdad (no un <code>Perro</code>): ni con <code>virtual</code> puede comportarse como perro."},{t:"mcq",id:"m02-q4",q:"¿Cuál es la razón principal para declarar `virtual ~Base()`?",opts:["Para que la clase base sea abstracta","Para que `delete` sobre un `Base*` que apunta a un derivado ejecute también el destructor derivado","Para poder copiar objetos por valor","Para que el destructor sea más rápido"],ans:1,why:"Sin destructor virtual, `delete basePtr` solo llama a `~Base` y los recursos del derivado se pierden. Regla práctica: si una clase tiene algún método virtual, su destructor también debe serlo."},{t:"mcq",id:"m02-q5",q:"Si `Forma` tiene `virtual int area() const = 0;`, ¿qué es correcto?",opts:["`Forma f;` compila y `area()` devuelve 0","`Forma* p = new Forma();` compila","`Forma* p = new Cuadrado(2);` compila si `Cuadrado` implementa `area()`","Ninguna clase puede heredar de `Forma`"],ans:2,why:"No se puede instanciar una clase abstracta, pero sí tener punteros/referencias a ella y apuntarlos a objetos derivados concretos."},{t:"h2",id:"s7",text:"7. Templates: código genérico"},{t:"p",text:'Un **template** es una "plantilla": escribís el código una vez con un tipo comodín `T` y el compilador genera una versión concreta para cada tipo con el que lo uses (`int`, `double`, `string`…). Es la forma en que están hechos `vector<T>`, `stack<T>` y los `Stack<TData>`, `Queue<TData>` del examen.'},{t:"live",title:"Ejemplo 10 — función template",code:`template <typename T>
T mayor(T a, T b) {
    return a > b ? a : b;
}
int main() {
    cout << mayor(3, 7) << endl;               // T = int (deducido)
    cout << mayor(2.5, 1.5) << endl;           // T = double
    cout << mayor<double>(1, 2.5) << endl;     // T indicado a mano
}`,note:"El compilador <strong>deduce</strong> <code>T</code> mirando los argumentos. <code>mayor(3, 2.5)</code> no compilaría: <code>T</code> no puede ser <code>int</code> y <code>double</code> a la vez (por eso el tercer ejemplo fuerza <code>&lt;double&gt;</code>)."},{t:"live",title:"Ejemplo 11 — clase template",code:`template <typename T>
class Caja {
    T valor;
public:
    Caja(const T& v) : valor(v) {}
    T get() const { return valor; }
    void set(const T& v) { valor = v; }
};
int main() {
    Caja<int> a(5);
    Caja<string> s("hola");
    a.set(a.get() + 1);
    cout << a.get() << " " << s.get() << endl;
}`,note:"Para las clases hay que escribir el tipo <strong>siempre</strong>: <code>Caja&lt;int&gt;</code>. <code>Caja</code> a secas no es un tipo, es una plantilla."},{t:"h3",text:"Un arreglo dinámico genérico con Regla de 3"},{t:"p",text:"Este es el molde de casi todas las estructuras del curso (pila, cola, lista): una clase template que reserva memoria en el constructor, la libera en el destructor y copia en profundidad."},{t:"live",title:"Ejemplo 12 — Arreglo<T> completo",code:`template <typename T>
class Arreglo {
    T* d;
    int n;
public:
    Arreglo(int n_) : d(new T[n_]), n(n_) {}
    Arreglo(const Arreglo& o) : d(new T[o.n]), n(o.n) {
        for (int i = 0; i < n; i++) d[i] = o.d[i];
    }
    Arreglo& operator=(const Arreglo& o) {
        if (this != &o) {
            T* nuevo = new T[o.n];
            for (int i = 0; i < o.n; i++) nuevo[i] = o.d[i];
            delete[] d;
            d = nuevo; n = o.n;
        }
        return *this;
    }
    ~Arreglo() { delete[] d; }
    T& operator[](int i) { return d[i]; }
    int size() const { return n; }
};
int main() {
    Arreglo<int> a(3);
    for (int i = 0; i < 3; i++) a[i] = i * 10;
    Arreglo<int> b = a;
    b[0] = 99;
    cout << a[0] << " " << b[0] << " " << b.size() << endl;

struct Nodo {

};

    Nodo* head = nullptr; Nodo* tail = nullptr;
    for (int v : vals) {
        Nodo* n = new Nodo(v);
        if (!head) { head = tail = n; } else { tail->next = n; tail = n; }
    }
    return head;
}

        if (head->next) cout << " -> ";

    }
