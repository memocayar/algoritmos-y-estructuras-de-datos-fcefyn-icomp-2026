int main() {
    f(3);
}`,why:"Yendo: imprime 3, 2, 1. Al llegar a `f(0)` retorna y vuelve: cada marco imprime su `n` después de la llamada: 1, 2, 3. Total: `3 2 1 1 2 3`."},{t:"h2",id:"s3",text:"3. La pila de llamadas y el stack overflow"},{t:"p",text:"Cada llamada activa ocupa un **marco** en el stack (Módulo 1) con sus parámetros y variables locales. Si las llamadas nunca terminan de anidarse (falta el caso base, o no se acerca a él), el stack se llena y el programa muere con **stack overflow**."},{t:"live",title:"Error — recursión sin caso base",code:`int sumar(int n) {
    return n + sumar(n - 1);      // ¿y cuándo se detiene?
}
int main() {
    cout << sumar(3) << endl;
}`,note:"Se apilan marcos <code>sumar(3)</code>, <code>(2)</code>, <code>(1)</code>, <code>(0)</code>, <code>(-1)</code>… hasta que el stack se agota. En un programa real esto termina el proceso de golpe (segmentation fault), sin posibilidad de recuperarse."},{t:"find",id:"m03-f1",code:`int factorial(int n) {
    if (n == 1) return 1;
    return n * factorial(n - 1);
}
int main() {
    cout << factorial(0) << endl;
}`,q:"¿Qué pasa al ejecutar este programa?",opts:["Imprime 1","Imprime 0","Recursión infinita: `factorial(0)` llama a `factorial(-1)`, `factorial(-2)`… nunca llega a `n == 1`","No compila"],ans:2,why:"El caso base solo cubre `n == 1`. Con `n = 0` (o negativo) el argumento se **aleja** del caso base. Solución: `if (n <= 1) return 1;` o `if (n == 0) return 1;`. Siempre preguntate qué pasa con el valor más chico posible."},{t:"mcq",id:"m03-q1",q:'Un desarrollador propone reemplazar todos los algoritmos iterativos de un sistema crítico por versiones recursivas "más elegantes". ¿Cuál es el principal riesgo?',opts:["La recursión siempre es más lenta y por eso está prohibida","Los compiladores convierten toda recursión en loops, así que no hay riesgo","Cada llamada activa consume un marco de stack: con entradas profundas se produce stack overflow y el proceso termina abruptamente, sin recuperación controlada","Solo es más difícil de leer"],ans:2,why:"Esta pregunta aparece (casi igual) en el modelo de parcial. El costo real es memoria de stack proporcional a la profundidad. La recursión **a la cola** puede convertirse a iterativa (sección 6) y así eliminar el riesgo."},{t:"h2",id:"s4",text:"4. Recursión sobre números y arreglos"},{t:"note",kind:"warn",title:"Ojo con qué significa `n`",text:"En los apuntes de la cátedra hay dos convenciones: en `07_Recursion` (ejemplo `suma(v, n)`) **`n` es el índice del último elemento** (`v[5]` de un arreglo de 6); en la Guía Práctica **`cantidad` es cuántos elementos mirar** (`cantidad = 5` → `v[0..4]`, y el último es `v[cantidad - 1]`). Leé el enunciado: confundirlas te da un acceso fuera de rango."},{t:"live",title:"Ejemplo 3 — sumar un arreglo (n = índice del último)",code:`int suma(int v[], int n) {
    if (n == 0) return v[0];             // un solo elemento
    return v[n] + suma(v, n - 1);        // último + suma del resto
}
int main() {
    int v[6] = {17, 15, -8, 30, 5, -2};
    cout << suma(v, 5) << endl;
}`,note:"El arreglo <strong>no se copia</strong>: en cada marco <code>v</code> apunta al mismo arreglo (es un puntero) y solo cambia <code>n</code>."},{t:"live",title:"Ejemplo 4 — recorrer un string con puntero (p + 1)",code:`void imprimir(const char* p) {
    if (*p == '\\0') return;         // caso base: fin de la cadena
    cout << *p << " ";
    imprimir(p + 1);                // el "resto" es el puntero corrido una posición
}
int main() {
    char nombre[] = "Juan";
    imprimir(nombre);
    cout << endl;
}`,note:'Otra forma de "achicar" el problema: en vez de bajar un contador, **avanzás el puntero**. El resto de la cadena empieza en <code>p + 1</code>.'},{t:"live",title:"Ejemplo 5 — dos extremos: ¿es palíndromo?",code:`bool esPalindromo(const char t[], int ini, int fin) {
    if (ini >= fin) return true;             // 0 o 1 letras: sí
    if (t[ini] != t[fin]) return false;      // extremos distintos: no
    return esPalindromo(t, ini + 1, fin - 1);
}
int main() {
    char a[] = "reconocer";
    char b[] = "casa";
    cout << esPalindromo(a, 0, 8) << " " << esPalindromo(b, 0, 3) << endl;
}`,note:"Acá el problema se achica por **los dos lados** a la vez: <code>ini</code> sube y <code>fin</code> baja hasta cruzarse."},{t:"live",title:"Ejemplo 6 — dígitos de un número",code:`int sumarDigitos(int n) {
    if (n < 10) return n;                   // un dígito
    return n % 10 + sumarDigitos(n / 10);   // último dígito + los demás
}
int main() {
    cout << sumarDigitos(1234) << endl;
}`,note:'<code>n % 10</code> es el último dígito y <code>n / 10</code> es "el número sin su último dígito". Es el patrón de casi todos los ejercicios con números.'},{t:"h3",text:"Recursión múltiple: Fibonacci y las Torres de Hanoi"},{t:"p",text:"Cuando una función se llama **más de una vez** por ejecución, las llamadas forman un **árbol**. Fibonacci: `F(n) = F(n-1) + F(n-2)`, con `F(0) = 0` y `F(1) = 1`."},{t:"live",title:"Ejemplo 7 — Fibonacci y cuántas veces se llama",code:`int llamadas = 0;
int fib(int n) {
    llamadas++;
    if (n < 2) return n;
    return fib(n - 1) + fib(n - 2);
}
int main() {
    cout << fib(5) << endl;
    cout << "llamadas: " << llamadas << endl;
}`,note:"<code>fib(5)</code> hace <strong>15</strong> llamadas porque recalcula lo mismo muchas veces (<code>fib(3)</code> se calcula 2 veces, <code>fib(2)</code> 3 veces…). Es correcta pero ineficiente; en el examen alcanza con que sea correcta."},{t:"p",text:"**Torres de Hanoi**: mover `n` discos de la torre `a` a la `c` usando `b` de auxiliar, sin apoyar un disco grande sobre uno chico. Idea recursiva: (1) mové los `n-1` de arriba de `a` a `b`; (2) mové el disco más grande de `a` a `c`; (3) mové los `n-1` de `b` a `c`."},{t:"live",title:"Ejemplo 8 — Torres de Hanoi (3 discos)",code:`void hanoi(char a, char c, char b, int n) {
    if (n > 0) {
        hanoi(a, b, c, n - 1);                          // n-1 discos: a → b (auxiliar c)
        cout << "Mover " << n << " desde " << a << " hasta " << c << endl;
        hanoi(b, c, a, n - 1);                          // n-1 discos: b → c (auxiliar a)
    }
}
int main() {
    hanoi('a', 'c', 'b', 3);
}`,note:'Fijate que el caso base es "no hacer nada" cuando <code>n == 0</code>. Para <code>n</code> discos hacen falta 2ⁿ − 1 movimientos (7 para 3 discos).'},{t:"mcq",id:"m03-q2",q:"En `int f(int n) { if (n < 2) return n; return f(n-1) + f(n-2); }`, ¿qué hace `f(4)`?",opts:["Devuelve 3","Devuelve 4","Devuelve 8","Devuelve 2"],ans:0,why:"f(0)=0, f(1)=1, f(2)=1, f(3)=2, f(4)=f(3)+f(2)=3."},{t:"h2",id:"s5",text:"5. Recursión sobre listas enlazadas"},{t:"p",text:"Una lista enlazada es *recursiva por definición*: **o está vacía (`nullptr`), o es un nodo seguido de otra lista** (`head->next`). Por eso las funciones sobre listas salen casi solas:"},{t:"table",head:["Parte","En una lista"],rows:[["Caso base","`head == nullptr` (lista vacía). A veces también `head->next == nullptr` (un solo nodo)."],["Caso recursivo",'Resolvé para `head->next` (el "resto") y combiná con `head->valor`.'],["Progreso","Cada llamada avanza un nodo: `head->next`."]]},{t:"live",title:"Ejemplo 9 — longitud y suma de una lista",code:`struct Nodo {
    int valor;
    Nodo* next;
    Nodo(int v, Nodo* n) : valor(v), next(n) {}
};
int longitud(Nodo* h) {
    if (h == nullptr) return 0;
    return 1 + longitud(h->next);
}
int sumar(Nodo* h) {
    if (h == nullptr) return 0;
    return h->valor + sumar(h->next);
}
int main() {
    Nodo* l = new Nodo(4, new Nodo(6, new Nodo(2, nullptr)));
    cout << longitud(l) << " " << sumar(l) << endl;
    delete l->next->next; delete l->next; delete l;
}`,note:'Mirá cómo el puntero <code>h</code> de cada marco apunta a un nodo distinto del heap: el marco de la primera llamada ve toda la lista, el siguiente ve "el resto", y así hasta <code>nullptr</code>.'},{t:"live",title:"Ejemplo 10 — mostrar la lista al revés (usando la vuelta)",code:`struct Nodo {
    int valor;
    Nodo* next;
    Nodo(int v, Nodo* n) : valor(v), next(n) {}
};
void alReves(Nodo* h) {
    if (h == nullptr) return;
    alReves(h->next);            // primero bajo hasta el final...
    cout << h->valor << " ";     // ...y imprimo al volver
}
int main() {
    Nodo* l = new Nodo(1, new Nodo(2, new Nodo(3, nullptr)));
    alReves(l);
    cout << endl;
    delete l->next->next; delete l->next; delete l;
}`,note:'Una lista simple no se puede recorrer hacia atrás… pero la <strong>pila de llamadas</strong> sí "recuerda" los nodos anteriores. Es el mismo truco que <code>subir()</code> del ejemplo 2.'},{t:"h3",text:"Ruta válida y compresión (los dos del modelo de parcial)"},{t:"p",text:"En el examen, la lista viene con `struct Nodo { int valor; Nodo* next; explicit Nodo(int v) ... }` y tenés que completar una función recursiva. Dos patrones clave: **mirar el nodo actual y el siguiente** (`rutaValida`) y **modificar la lista mientras volvés** (`compress`)."},{t:"live",title:"Ejemplo 11 — rutaValida (no decreciente)",code:`struct Nodo {
    int altura;
    Nodo* next;
    explicit Nodo(int h) : altura(h), next(nullptr) {}
};
bool rutaValida(Nodo* head) {
    if (head == nullptr || head->next == nullptr) return true;   // 0 o 1 nodos: válida
    if (head->altura > head->next->altura) return false;         // bajó: inválida
    return rutaValida(head->next);                               // el resto también debe serlo
}
int main() {
    Nodo* a = new Nodo(10); a->next = new Nodo(20); a->next->next = new Nodo(30);
    cout << rutaValida(a) << endl;
    a->next->altura = 5;
    cout << rutaValida(a) << endl;
    delete a->next->next; delete a->next; delete a;
}`,note:"Hay <strong>dos casos base</strong>: lista vacía y lista de un nodo (porque después necesitás <code>head->next->altura</code>: si <code>next</code> fuera <code>nullptr</code> sería una desreferencia nula). Es el error típico de este ejercicio."},{t:"live",title:"Ejemplo 12 — compress: quitar repetidos consecutivos",code:`struct Nodo {
    int valor;
    Nodo* next;
    explicit Nodo(int v) : valor(v), next(nullptr) {}
};
Nodo* compress(Nodo* head) {
    if (head == nullptr) return nullptr;
    head->next = compress(head->next);           // 1) comprimo primero el resto
    if (head->next && head->next->valor == head->valor) {
        Nodo* dup = head->next;                  // 2) el siguiente es igual a mí: sobra
        head->next = dup->next;
        delete dup;                              //    lo libero (pide el enunciado)
    }
    return head;                                 // 3) devuelvo mi (nueva) cabeza
}
int main() {
    Nodo* l = new Nodo(1);
    l->next = new Nodo(1);
    l->next->next = new Nodo(2);
    l = compress(l);
    for (Nodo* p = l; p; p = p->next) cout << p->valor << " ";
    cout << endl;
    while (l) { Nodo* t = l->next; delete l; l = t; }
}`,note:'Patrón "<strong>reenganchar el resto</strong>": <code>head->next = f(head->next)</code>. La función devuelve la cabeza de la lista ya resuelta y cada marco la engancha a sí mismo al volver. Como comprimimos el resto <em>antes</em> de comparar, alcanza con mirar solo el siguiente nodo.'},{t:"note",kind:"tip",title:"Truco para `compress` y parecidos",text:'Pensalo así: "supongamos que `compress(head->next)` ya me devuelve la cola sin repetidos. Mi único trabajo es decidir si **mi valor coincide con el primero de esa cola**; si sí, lo saco (y hago `delete`)". Con eso ya no hace falta loop ni estructura auxiliar.'},{t:"h2",id:"s6",text:"6. Recursión a la cola y su versión iterativa"},{t:"p",text:'Una recursiva es **a la cola** (*tail recursion*) cuando la llamada recursiva es **lo último que hace la función** y su resultado se devuelve tal cual, sin operar con él. Solo es "simple" si hay **una única** llamada recursiva.'},{t:"table",head:["¿A la cola?","Código","Por qué"],rows:[["No","`return n * factorial(n - 1);`","Después de volver todavía hay que multiplicar por `n`."],["Sí","`return factAcum(n - 1, acc * n);`","Lo que devuelve la llamada es directamente el resultado. El trabajo se hizo *antes*, en el acumulador."],["No","`subir(n-1); cout << n;`","Hay una sentencia *después* de la llamada."],["No","`return fib(n-1) + fib(n-2);`","Dos llamadas y una suma después."]]},{t:"p",text:'Cuando falta la forma "a la cola", se agrega un **parámetro acumulador** que va llevando el resultado parcial. Ejemplo: el factorial pasa de `n * f(n-1)` a `f(n-1, acc * n)`.'},{t:"live",title:"Ejemplo 13 — factorial a la cola con acumulador",code:`long long factAcum(int n, long long acc) {
    if (n == 0) return acc;                    // corte: el resultado ya está en acc
    return factAcum(n - 1, acc * n);           // a la cola: nada después de la llamada
}
long long factorial(int n) {
    return factAcum(n, 1);                     // el acumulador arranca en 1
}
int main() {
    cout << factorial(5) << endl;
}`,note:"Comparalo con el ejemplo 1: acá el valor final <strong>ya viaja armado</strong> hacia adentro y el último marco lo devuelve directo, sin multiplicaciones al volver."},{t:"note",kind:"key",title:"Método de la cátedra: d, s, h",items:["**T1** = parámetros que **cambian** en cada llamada · **T2** = los que **no cambian**.","**d** = condición de corte · **s** = cómo cambian los parámetros de T1 · **h** = qué se devuelve al final.","Toda recursiva a la cola `f(t1, t2)` se transforma mecánicamente en:  `while (!d(t1, t2)) { t1 = s(t1, t2); }  return h(t1, t2);`","La condición de **corte de la recursión** pasa a ser la condición de **salida del bucle** (negada dentro del `while`)."]},{t:"p",text:"Ejemplo de la cátedra, la **división entera** con restas sucesivas. Versión recursiva a la cola (`c` acumula el cociente, `d` es el dividendo que va bajando, `q` es el divisor que no cambia):"},{t:"live",title:"Ejemplo 14 — división entera: recursiva a la cola",code:`struct Res { int cociente; int resto; };
Res deaux(int d, int q, int c) {
    if (d < q) return Res{c, d};            // d(): d < q   |   h(): (c, d)
    return deaux(d - q, q, c + 1);          // s(): (d - q, c + 1)
}
int main() {
    Res r = deaux(17, 5, 0);
    cout << "cociente=" << r.cociente << " resto=" << r.resto << endl;
}`,note:"Acá <strong>T1 = (d, c)</strong> (cambian), <strong>T2 = q</strong> (constante), corte <code>d &lt; q</code>, paso <code>(d − q, c + 1)</code>, resultado <code>(c, d)</code>."},{t:"live",title:"Ejemplo 15 — la misma función, iterativa (aplicando d, s, h)",code:`struct Res { int cociente; int resto; };
Res deauxIter(int d, int q, int c) {
    while (!(d < q)) {          // mientras NO se cumpla el corte
        d = d - q;              // s: los parámetros que cambian
        c = c + 1;
    }
    return Res{c, d};           // h: el resultado
}
int main() {
    Res r = deauxIter(17, 5, 0);
    cout << "cociente=" << r.cociente << " resto=" << r.resto << endl;
}`,note:"Misma salida, pero <strong>un solo marco</strong> en el stack: no hay riesgo de stack overflow. Esa es justamente la ventaja de la recursión a la cola."},{t:"mcq",id:"m03-q3",q:"¿Cuál de estas funciones es recursiva **a la cola**?",opts:["`int f(int n) { if (n == 0) return 0; return n + f(n - 1); }`","`int g(int n, int acc) { if (n == 0) return acc; return g(n - 1, acc + n); }`","`int h(int n) { if (n == 0) return 1; return 2 * h(n - 1); }`","`void k(int n) { if (n == 0) return; k(n - 1); cout << n; }`"],ans:1,why:"Solo `g` devuelve directamente el resultado de la llamada recursiva. En las otras hay una operación (`n +`, `2 *`, el `cout`) que se ejecuta **después** de la llamada."},{t:"mcq",id:"m03-q4",q:"En la transformación de recursiva a la cola a iterativa, ¿qué representa la función **d**?",opts:["Los parámetros que cambian","La condición de corte de la recursión, que se convierte en la condición de salida del `while`","El valor devuelto","El acumulador"],ans:1,why:"d = corte, s = cambio de parámetros (cuerpo del `while`), h = resultado final (el `return` después del bucle). T1 son los parámetros que cambian, T2 los que no."},{t:"h2",id:"s7",text:"7. Recursión dentro de clases (herencia y virtual)"},{t:"p",text:"Un método de una clase puede ser recursivo igual que una función. En la guía práctica aparece combinado con lo del Módulo 2: una interfaz abstracta y una clase derivada que implementa el método **recursivamente**, usada a través de un puntero a la base."},{t:"live",title:"Ejemplo 16 — método virtual recursivo",code:`class Secuencia {
public:
    virtual int termino(int n) = 0;
    virtual ~Secuencia() {}
};
class Factorial : public Secuencia {
public:
    int termino(int n) {
        if (n <= 1) return 1;
        return n * termino(n - 1);          // this->termino(...): vuelve a despachar virtual
    }
};
int main() {
    Factorial f;
    Secuencia* s = &f;
    cout << s->termino(5) << endl;
}`,note:"Dentro de un método, llamar a <code>termino(n - 1)</code> es <code>this-&gt;termino(n - 1)</code>: cada marco tiene su propio <code>this</code> (el mismo objeto) además de su propio <code>n</code>."},{t:"h2",id:"s8",text:"8. Ejercicios: la guía práctica de recursión"},{t:"p",text:"Son los de la guía de la cátedra (formato CodeRunner). El corrector, además de los tests, **verifica que uses recursión** y no bucles. Empezá por los primeros: si los hacés rápido, saltá a los de arreglos y listas."},{t:"h3",text:"Con números"},E("m03-e1","cuentaRegresiva","Escribí `void cuentaRegresiva(int n)`: muestra los números desde `n` hasta 0 separados por un espacio (`n >= 0`).","void cuentaRegresiva(int n)",[["cuentaRegresiva(0); cout << endl;","0"],["cuentaRegresiva(3); cout << endl;","3 2 1 0"],["cuentaRegresiva(5); cout << endl;","5 4 3 2 1 0",!0]],`void cuentaRegresiva(int n) {
    cout << n;
    if (n > 0) {
        cout << " ";
        cuentaRegresiva(n - 1);
    }
}`,{hints:["Imprimís `n` **antes** de la llamada recursiva (ida).","Cuidado con el espacio: no debe sobrar al final (aunque el corrector ignora espacios finales)."]}),E("m03-e2","mostrarAscendente","Escribí `void mostrarAscendente(int n)`: muestra, uno por línea, los números de 1 a `n`. Si `n` es 0 no muestra nada.","void mostrarAscendente(int n)",[["mostrarAscendente(1);","1"],["mostrarAscendente(4);",`1
2
3
4`],['mostrarAscendente(0); cout << "fin";',"fin",!0]],`void mostrarAscendente(int n) {
    if (n == 0) return;
    mostrarAscendente(n - 1);
    cout << n << endl;
}`,{hints:["Ahora imprimís en la **vuelta**: primero la llamada, después el `cout`."]}),E("m03-e3","sumarHasta","Escribí `int sumarHasta(int n)`: suma de 1 a `n` (`sumarHasta(0)` = 0).","int sumarHasta(int n)",[["cout << sumarHasta(0);","0"],["cout << sumarHasta(5);","15"],["cout << sumarHasta(100);","5050",!0]],`int sumarHasta(int n) {
    if (n == 0) return 0;
    return n + sumarHasta(n - 1);
}`),E("m03-e4","multiplicar","Escribí `int multiplicar(int a, int b)` usando **sumas sucesivas** (`b >= 0`): `a * b = a + a * (b-1)`.","int multiplicar(int a, int b)",[["cout << multiplicar(7, 0);","0"],["cout << multiplicar(6, 4);","24"],["cout << multiplicar(-3, 5);","-15",!0]],`int multiplicar(int a, int b) {
    if (b == 0) return 0;
    return a + multiplicar(a, b - 1);
}`),E("m03-e5","factorial","Escribí `long long factorial(int n)` (`0 <= n <= 12`).","long long factorial(int n)",[["cout << factorial(0);","1"],["cout << factorial(5);","120"],["cout << factorial(12);","479001600",!0]],`long long factorial(int n) {
    if (n == 0) return 1;
    return n * factorial(n - 1);
}`),E("m03-e6","potencia","Escribí `long long potencia(int base, int exponente)` (`exponente >= 0`).","long long potencia(int base, int exponente)",[["cout << potencia(2, 0);","1"],["cout << potencia(2, 5);","32"],["cout << potencia(3, 10);","59049",!0]],`long long potencia(int base, int exponente) {
    if (exponente == 0) return 1;
    return base * potencia(base, exponente - 1);
}`),E("m03-e7","cociente","Escribí `int cociente(int dividendo, int divisor)` con **restas sucesivas** (`dividendo >= 0`, `divisor > 0`).","int cociente(int dividendo, int divisor)",[["cout << cociente(3, 5);","0"],["cout << cociente(17, 5);","3"],["cout << cociente(20, 4);","5",!0]],`int cociente(int dividendo, int divisor) {
    if (dividendo < divisor) return 0;
    return 1 + cociente(dividendo - divisor, divisor);
}`),E("m03-e8","resto","Escribí `int resto(int dividendo, int divisor)` con **restas sucesivas**.","int resto(int dividendo, int divisor)",[["cout << resto(3, 5);","3"],["cout << resto(17, 5);","2"],["cout << resto(20, 4);","0",!0]],`int resto(int dividendo, int divisor) {
    if (dividendo < divisor) return dividendo;
    return resto(dividendo - divisor, divisor);
}`),E("m03-e9","sumarDigitos","Escribí `int sumarDigitos(int numero)` (`numero >= 0`).","int sumarDigitos(int numero)",[["cout << sumarDigitos(0);","0"],["cout << sumarDigitos(1234);","10"],["cout << sumarDigitos(90909);","27",!0]],`int sumarDigitos(int numero) {
    if (numero < 10) return numero;
    return numero % 10 + sumarDigitos(numero / 10);
}`),E("m03-e10","contarDigitos","Escribí `int contarDigitos(int numero)`. El 0 tiene un dígito.","int contarDigitos(int numero)",[["cout << contarDigitos(0);","1"],["cout << contarDigitos(7);","1"],["cout << contarDigitos(1234);","4",!0],["cout << contarDigitos(100);","3",!0]],`int contarDigitos(int numero) {

        std::cout << "\\n";
    }
    std::size_t size() const { return m_size; }
${l}
};`,xe=[{t:"note",kind:"key",title:"Qué vas a poder hacer al terminar este módulo",items:["Dibujar una lista enlazada y **hacer cirugía de punteros** sin perder nodos: insertar, eliminar, invertir, mover bloques.","Usar el patrón de **dos punteros** (`anterior` / `actual`) y el de **tortuga y liebre** (Floyd) para detectar ciclos y hallar el medio.","Manejar los **casos borde**: lista vacía, un solo nodo, cabeza, cola.","Trabajar con listas **dobles** (`prev` y `next`, `m_head`, `m_tail`, `m_size`) y **circulares**.","Resolver los ejercicios que toma la cátedra: `tieneLoop`, `moverBloqueInicialAlFinal`, `invertir`, `sumasAcumuladas`, inserción con prioridad…"]},{t:"note",kind:"tip",title:"La regla que ordena todo",text:'Cada vez que vayas a tocar un puntero preguntate: **"¿todavía tengo algún otro puntero que apunte a lo que estoy por desconectar?"** Si la respuesta es no, primero guardalo en una variable (`Nodo* siguiente = actual->next;`). Casi todos los errores de listas son por perder un nodo (fuga) o por desreferenciar `nullptr`.'},{t:"h2",id:"s1",text:"1. La lista enlazada: nodos con punteros"},{t:"p",text:"Un arreglo guarda todo junto y seguido. Una **lista enlazada** guarda cada elemento en un **nodo** separado del heap (`new`), y cada nodo tiene un puntero `next` al siguiente. El único acceso a la lista es el puntero a la **cabeza** (`head`): si lo perdés, perdiste la lista entera. El último nodo tiene `next == nullptr`."},{t:"table",head:["","Arreglo","Lista enlazada"],rows:[["Acceso al elemento i","Directo: `a[i]`","Hay que recorrer desde la cabeza"],["Insertar / borrar en el medio","Hay que correr todos los elementos","Solo se cambian un par de punteros"],["Tamaño","Fijo (o se recopia todo)","Crece nodo a nodo"],["Memoria","Un bloque","Un bloque por nodo + un puntero extra cada uno"]]},{t:"live",title:"Ejemplo 1 — lista con puntero a cabeza y a cola",code:`struct Nodo {
    int valor;
    Nodo* next;
    explicit Nodo(int v) : valor(v), next(nullptr) {}
};
class Lista {
    Nodo* head;
    Nodo* tail;
public:
    Lista() : head(nullptr), tail(nullptr) {}
    ~Lista() {
        while (head) { Nodo* t = head; head = head->next; delete t; }
    }
    void pushFront(int v) {
        Nodo* n = new Nodo(v);
        n->next = head;              // 1) el nuevo apunta a la vieja cabeza
        head = n;                    // 2) recién ahí la cabeza es el nuevo
        if (!tail) tail = n;         // lista que estaba vacía: también es la cola
    }
    void pushBack(int v) {
        Nodo* n = new Nodo(v);
        if (!tail) { head = tail = n; }
        else { tail->next = n; tail = n; }
    }
    void print() const {
        for (Nodo* c = head; c; c = c->next) cout << c->valor << " ";
        cout << endl;
    }
};
int main() {
    Lista l;
    l.pushBack(2);
    l.pushBack(3);
    l.pushFront(1);
    l.print();
}`,note:"Fijate en el orden de <code>pushFront</code>: <strong>primero</strong> <code>n-&gt;next = head</code> y <strong>después</strong> <code>head = n</code>. Al revés, perderías la lista. Con un puntero <code>tail</code> agregar al final es directo (sin recorrer); sin él hay que caminar hasta el último nodo."},{t:"h3",text:"Recorrer: el puntero `actual`"},{t:"p",text:"Nunca muevas `head`: usá un puntero auxiliar (`actual`) y avanzalo con `actual = actual->next`. La condición del bucle decide **dónde parás**:"},{t:"table",head:["Condición","Termina cuando","Usarla para"],rows:[["`while (actual != nullptr)`","`actual` se sale de la lista","Procesar **todos** los nodos"],["`while (actual->next != nullptr)`","`actual` es el **último** nodo","Llegar al final (agregar, buscar el último). **Antes** hay que chequear que la lista no esté vacía."],["`while (actual && actual->valor != x)`","lo encontraste o se acabó","Buscar. El orden del `&&` importa: primero `actual` (si no, desreferenciás `nullptr`)."]]},{t:"mcq",id:"m04-q1",q:"¿Qué pasa con `while (actual->valor != x && actual != nullptr)` cuando `x` no está en la lista?",opts:["Termina bien y devuelve nullptr","Cuando `actual` llega a `nullptr` se evalúa `actual->valor` primero: desreferencia nula (segmentation fault)","Bucle infinito","No compila"],ans:1,why:"El `&&` evalúa de izquierda a derecha y corta apenas algo es falso. Hay que poner `actual != nullptr` **primero** para protegerse."},{t:"h2",id:"s2",text:"2. Insertar en el medio: el orden de los punteros"},{t:"p",text:'Para insertar un nodo `nuevo` **después** de `p`: (1) que `nuevo` apunte a lo que hoy sigue a `p`; (2) recién ahí que `p` apunte a `nuevo`. Siempre "primero enganchá lo nuevo a lo viejo, después cortá lo viejo".'},{t:"live",title:"Ejemplo 2 — insertar después de un nodo",code:`struct Nodo {
    int valor;
    Nodo* next;
    Nodo(int v, Nodo* n) : valor(v), next(n) {}
};
int main() {
    Nodo* c = new Nodo(30, nullptr);
    Nodo* b = new Nodo(20, c);
    Nodo* a = new Nodo(10, b);
    Nodo* nuevo = new Nodo(15, nullptr);
    nuevo->next = a->next;        // 1) nuevo → b
    a->next = nuevo;              // 2) a → nuevo
    for (Nodo* p = a; p; p = p->next) cout << p->valor << " ";
    cout << endl;
    delete a; delete nuevo; delete b; delete c;
}`,note:"Avanzá paso a paso: después del paso 1 hay <strong>dos</strong> flechas hacia <code>b</code> (la de <code>a</code> y la de <code>nuevo</code>); el paso 2 corta la de <code>a</code> y la redirige."},{t:"live",title:"Trampa — orden equivocado: se pierde el resto de la lista",allowLeak:!0,code:`struct Nodo {
    int valor;
    Nodo* next;
    Nodo(int v, Nodo* n) : valor(v), next(n) {}
};
int main() {
    Nodo* c = new Nodo(30, nullptr);
    Nodo* b = new Nodo(20, c);
    Nodo* a = new Nodo(10, b);
    Nodo* nuevo = new Nodo(15, nullptr);
    a->next = nuevo;              // ¡cortamos primero! b y c quedan sin dueño
    nuevo->next = a->next;        // a->next ya es nuevo: nuevo apunta a sí mismo
    cout << a->valor << " " << a->next->valor << endl;
}`,note:"Al hacer <code>a-&gt;next = nuevo</code> primero, ya <strong>nadie apunta a <code>b</code></strong> (salvo la variable local <code>b</code>, que morirá) y el <code>nuevo-&gt;next = a-&gt;next</code> siguiente hace que <code>nuevo</code> se apunte a sí mismo. Además ningún nodo se libera: fugas. Recorrer esa lista sería un bucle infinito."},{t:"h2",id:"s3",text:"3. Eliminar: guardar antes de liberar"},{t:"p",text:'Para eliminar un nodo hace falta **el nodo anterior** (para "puentear" el nodo) y **una copia del puntero al nodo** (para poder hacer `delete` después de puentearlo). Por eso el patrón de dos punteros: `anterior` y `actual`. Casos: (a) es la **cabeza** (no hay anterior: se mueve `head`); (b) está en el **medio**; (c) es el **último**; (d) no está.'},{t:"live",title:"Ejemplo 3 — eliminar la primera aparición de un valor",code:`struct Nodo {
    int valor;
    Nodo* next;
    Nodo(int v, Nodo* n) : valor(v), next(n) {}
};
Nodo* eliminar(Nodo* head, int x) {
    Nodo* anterior = nullptr;
    Nodo* actual = head;
    while (actual != nullptr && actual->valor != x) {
        anterior = actual;                // avanzan juntos
        actual = actual->next;
    }
    if (actual == nullptr) return head;   // no estaba
    if (anterior == nullptr) head = actual->next;   // era la cabeza
    else anterior->next = actual->next;             // puenteo
    delete actual;                        // recién ahora liberamos
    return head;
}
int main() {
    Nodo* l = new Nodo(1, new Nodo(2, new Nodo(3, nullptr)));
    l = eliminar(l, 2);
    for (Nodo* p = l; p; p = p->next) cout << p->valor << " ";
    cout << endl;
    l = eliminar(l, 1);
    l = eliminar(l, 3);
    cout << (l == nullptr) << endl;
}`,note:"Cuando el nodo a borrar es la cabeza, <code>anterior</code> sigue en <code>nullptr</code>: por eso la función <strong>devuelve la (posible) nueva cabeza</strong>. Quien llama tiene que hacer <code>l = eliminar(l, x)</code>."},{t:"find",id:"m04-f1",code:`struct Nodo {
    int valor;
    Nodo* next;
    Nodo(int v, Nodo* n) : valor(v), next(n) {}
};
void borrarPrimero(Nodo*& head) {
    delete head;
    head = head->next;
}
int main() {
    Nodo* h = new Nodo(1, new Nodo(2, nullptr));
    borrarPrimero(h);
    cout << h->valor << endl;
}`,q:"¿Qué está mal en esta función?",opts:["Nada, borra la cabeza correctamente","Después del `delete head`, `head->next` lee memoria liberada (use-after-free): hay que guardar `next` antes","Falta un `delete[]`","Debería recibir `Nodo*` por valor"],ans:1,why:"Solución: `Nodo* t = head; head = head->next; delete t;`. Regla: **guardar → mover → liberar**."},{t:"h2",id:"s4",text:"4. Lista doble: prev y next"},{t:"p",text:'En una lista **doblemente enlazada** cada nodo tiene `prev` y `next`, y la lista guarda `m_head` y `m_tail` (y `m_size`). Se puede recorrer en los dos sentidos y borrar un nodo sin necesitar "el anterior" (ya está en `prev`), pero **cada cirugía toca más punteros**: hay que mantener coherentes `prev`, `next`, `m_head`, `m_tail` y `m_size`.'},{t:"note",kind:"key",title:"Invariantes de una lista doble (lo que siempre debe cumplirse)",items:["`m_head == nullptr` ⟺ `m_tail == nullptr` ⟺ `m_size == 0`.","`m_head->prev == nullptr` y `m_tail->next == nullptr`.","Para todo nodo `n`: si `n->next != nullptr` entonces `n->next->prev == n` (y simétrico con `prev`).","`m_size` = cantidad de nodos alcanzables desde `m_head`."]},{t:"live",title:"Ejemplo 4 — borrar un nodo cualquiera en una lista doble",code:`struct Node {
    int data;
    Node* next;
    Node* prev;
    explicit Node(int d) : data(d), next(nullptr), prev(nullptr) {}
};
struct DLL {
    Node* head = nullptr;
    Node* tail = nullptr;
    int size = 0;
    void pushBack(int v) {
        Node* n = new Node(v);
        if (!tail) { head = tail = n; }
        else { n->prev = tail; tail->next = n; tail = n; }
        size++;
    }
    void borrar(Node* n) {
        if (n->prev) n->prev->next = n->next; else head = n->next;   // ¿era la cabeza?
        if (n->next) n->next->prev = n->prev; else tail = n->prev;   // ¿era la cola?
        delete n;
        size--;
    }
    void print() const {
        for (Node* c = head; c; c = c->next) cout << c->data << " ";
        cout << "| ";
        for (Node* c = tail; c; c = c->prev) cout << c->data << " ";
        cout << endl;
    }
};
int main() {
    DLL l;
    l.pushBack(1); l.pushBack(2); l.pushBack(3);
    l.borrar(l.head->next);
    l.print();
    l.borrar(l.head);
    l.print();
    while (l.head) l.borrar(l.head);      // libero lo que queda
}`,note:"Cada <code>if</code> maneja un extremo: si el nodo <strong>no tiene</strong> <code>prev</code> era la cabeza y hay que mover <code>head</code>; si no tiene <code>next</code> era la cola y hay que mover <code>tail</code>. Sin esos <code>else</code>, <code>head</code>/<code>tail</code> quedarían apuntando a un nodo liberado."},{t:"p",text:"**Mover un bloque** (ejercicio del examen `moverBloqueInicialAlFinal`): no se crean ni destruyen nodos; solo se **re-enlazan** 4 punteros: `newHead->prev = nullptr`, `last->next = nullptr`, `first->prev = m_tail`, `m_tail->next = first`, y se actualizan `m_head` y `m_tail`. Está en los ejercicios con tests que verifican también el recorrido **inverso** (para cazar `prev` mal puestos)."},{t:"mcq",id:"m04-q2",q:"En una lista doble con `m_head`, `m_tail` y `m_size`, al eliminar el **único** nodo, ¿qué debe quedar?",opts:["`m_head = nullptr`, `m_tail` sin tocar","`m_head == nullptr`, `m_tail == nullptr` y `m_size == 0`","Solo `m_size = 0`","`m_head = m_tail` apuntando al nodo borrado"],ans:1,why:"Los tres deben ser coherentes (invariante). Con el código genérico de borrado: el nodo no tiene `prev` → `m_head = n->next` (nullptr); no tiene `next` → `m_tail = n->prev` (nullptr)."},{t:"h2",id:"s5",text:"5. Lista circular"},{t:"p",text:'En una lista **circular** el último nodo apunta a la cabeza (`ultimo->next == head`): no hay `nullptr` al final. Es útil cuando hay que "dar vueltas" (turnos, rotaciones). **Cuidado**: `while (actual != nullptr)` es un **bucle infinito**. Se recorre con `do { … } while (actual != head)`.'},{t:"live",title:"Ejemplo 5 — recorrer y rotar una lista circular",code:`struct Nodo {
    int valor;
    Nodo* next;
    explicit Nodo(int v) : valor(v), next(nullptr) {}
};
int main() {
    Nodo* a = new Nodo(1);
    Nodo* b = new Nodo(2);
    Nodo* c = new Nodo(3);
    a->next = b; b->next = c; c->next = a;      // c cierra el círculo
    Nodo* head = a;
    Nodo* actual = head;
    do {
        cout << actual->valor << " ";
        actual = actual->next;
    } while (actual != head);
    cout << endl;
    head = head->next;                          // "rotar": ahora empieza en 2
    actual = head;
    do {
        cout << actual->valor << " ";
        actual = actual->next;
    } while (actual != head);
    cout << endl;
    delete a; delete b; delete c;
}`,note:"Rotar una lista circular es <strong>mover un solo puntero</strong>: <code>head = head-&gt;next</code>. Es el truco de la cátedra para <code>Cola::rotar(k)</code>: cerrar el círculo, avanzar k−1 pasos, cortar ahí (Módulo 5)."},{t:"h2",id:"s6",text:"6. Floyd: tortuga y liebre (ciclos y punto medio)"},{t:"p",text:'Si por error un nodo apunta a uno anterior, la lista tiene un **ciclo** y un recorrido normal no termina nunca. **Algoritmo de Floyd**: dos punteros, `slow` avanza **1** y `fast` avanza **2**. Si hay ciclo, `fast` termina "alcanzando" a `slow` (`slow == fast`); si no hay, `fast` llega a `nullptr`. No usa memoria extra.'},{t:"live",title:"Ejemplo 6 — tieneLoop (versión correcta)",code:`struct Nodo {
    int valor;
    Nodo* next;
    explicit Nodo(int v) : valor(v), next(nullptr) {}
};
bool tieneLoop(Nodo* head) {
    Nodo* slow = head;
    Nodo* fast = head;
    while (fast != nullptr && fast->next != nullptr) {   // se puede dar 2 pasos
        slow = slow->next;
        fast = fast->next->next;
        if (slow == fast) return true;
    }
    return false;
}
int main() {
    Nodo* a = new Nodo(1); Nodo* b = new Nodo(2); Nodo* c = new Nodo(3); Nodo* d = new Nodo(4);
    a->next = b; b->next = c; c->next = d;
    cout << tieneLoop(a) << endl;     // sin ciclo
    d->next = b;                      // ciclo: 4 → 2
    cout << tieneLoop(a) << endl;
    d->next = nullptr;                // deshago el ciclo para poder liberar
    delete a; delete b; delete c; delete d;
}`,note:"Con <code>d-&gt;next = b</code> la lista tiene un ciclo (2 → 3 → 4 → 2). Mirá cómo <code>slow</code> y <code>fast</code> giran hasta encontrarse."},{t:"live",title:"Error — el bug del modelo de parcial (fast->next->next)",code:`struct Nodo {
    int valor;
    Nodo* next;
    explicit Nodo(int v) : valor(v), next(nullptr) {}
};
bool tieneLoop(Nodo* head) {
    Nodo* slow = head;
    Nodo* fast = head;
    while (fast != nullptr) {
        slow = slow->next;
        fast = fast->next->next;      // BUG: ¿y si fast->next es nullptr?
        if (slow == fast) return true;
    }
    return false;
}
int main() {
    Nodo* a = new Nodo(1); Nodo* b = new Nodo(2); Nodo* c = new Nodo(3);
    a->next = b; b->next = c;         // 3 nodos: longitud impar, sin ciclo
    cout << tieneLoop(a) << endl;
}`,note:"En una lista <strong>sin ciclo y de longitud impar</strong>, <code>fast</code> queda en el último nodo (<code>next == nullptr</code>) y <code>fast-&gt;next-&gt;next</code> es <code>nullptr-&gt;next</code>: desreferencia nula. Corrección: <code>while (fast != nullptr &amp;&amp; fast-&gt;next != nullptr)</code>."},{t:"note",kind:"tip",title:"Otros usos de tortuga y liebre",text:'Con la misma condición `while (fast && fast->next)` (sin buscar ciclos, en listas normales): cuando `fast` termina, `slow` está **en el medio** de la lista. Sirve para "el nodo del medio" y para partir una lista en dos mitades.'},{t:"h2",id:"s7",text:"7. Invertir una lista"},{t:"p",text:'Invertir "in place" es reconectar todas las flechas al revés, **sin crear nodos**. Iterativo: tres punteros `previo`, `actual`, `siguiente`. Recursivo (el que muestra la cátedra): bajar hasta el último nodo, y **al volver** hacer que el siguiente apunte hacia mí y cortar mi propio `next`.'},{t:"live",title:"Ejemplo 7 — invertir (iterativo)",code:`struct Nodo {
    int valor;
    Nodo* next;
    explicit Nodo(int v) : valor(v), next(nullptr) {}
};
Nodo* invertir(Nodo* head) {
    Nodo* previo = nullptr;
    while (head != nullptr) {
        Nodo* siguiente = head->next;   // 1) guardo lo que sigue
        head->next = previo;            // 2) doy vuelta la flecha
        previo = head;                  // 3) avanzo los dos punteros
        head = siguiente;
    }
    return previo;                      // el último nodo es la nueva cabeza
}
int main() {
    Nodo* l = new Nodo(1); l->next = new Nodo(2); l->next->next = new Nodo(3);
    l = invertir(l);
    for (Nodo* p = l; p; p = p->next) cout << p->valor << " ";
    cout << endl;
    while (l) { Nodo* t = l->next; delete l; l = t; }
}`,note:'Seguí <code>previo</code>, <code>head</code> y <code>siguiente</code> durante el bucle: son las tres piezas de la "cirugía". El paso 1 es el que evita perder el resto de la lista.'},{t:"live",title:"Ejemplo 8 — invertir (recursivo, in place)",code:`struct Nodo {
    int valor;
    Nodo* next;
    explicit Nodo(int v) : valor(v), next(nullptr) {}
};
Nodo* invertirRec(Nodo* n) {
    if (n == nullptr || n->next == nullptr) return n;     // 0 o 1 nodo: ya está invertida
    Nodo* nuevaCabeza = invertirRec(n->next);             // Fase 1: descenso (delego el resto)
    n->next->next = n;                                    // Fase 2: el siguiente me apunta a mí
    n->next = nullptr;                                    // Fase 3: corto mi enlace (evita ciclos)
    return nuevaCabeza;                                   // la cabeza nueva "burbujea" hacia arriba
}
int main() {
    Nodo* l = new Nodo(1); l->next = new Nodo(2); l->next->next = new Nodo(3);
    l = invertirRec(l);
    for (Nodo* p = l; p; p = p->next) cout << p->valor << " ";
    cout << endl;
    while (l) { Nodo* t = l->next; delete l; l = t; }
}`,note:'La cabeza nueva (el último nodo original) la devuelve el caso base y "sube" sin modificarse por todas las llamadas. Ojo: aunque no use <code>new</code> ni bucles, gasta O(N) de <strong>stack</strong> por la recursión.'},{t:"h2",id:"s8",text:"8. Ejercicios"},{t:"p",text:"Primero funciones sueltas sobre `Nodo*` (como en el modelo de parcial), después métodos de clases template como los de la práctica y el examen. Todos verifican que **no pierdas memoria**."},{t:"h3",text:"Funciones sobre Nodo*"},{t:"ex",id:"m04-e1",title:"Insertar al final",desc:"Escribí `Nodo* insertarAlFinal(Nodo* head, int v)`: agrega un nodo con `v` al final y devuelve la cabeza (si la lista estaba vacía, la nueva cabeza).",pre:W,starter:`Nodo* insertarAlFinal(Nodo* head, int v) {
    // TU CÓDIGO ACÁ
    return head;
}`,tests:[{main:`Nodo* l = nullptr;
    l = insertarAlFinal(l, 1);
    l = insertarAlFinal(l, 2);
    l = insertarAlFinal(l, 3);
    printList(l);
    freeList(l);`,expected:"1 -> 2 -> 3"},{main:`Nodo* l = buildList({7});
    l = insertarAlFinal(l, 8);
    printList(l);
    freeList(l);`,expected:"7 -> 8",hidden:!0}],hints:["Si `head == nullptr` devolvé el nodo nuevo.","Si no, recorré con `actual` mientras `actual->next != nullptr`, y colgá el nuevo."],solution:`Nodo* insertarAlFinal(Nodo* head, int v) {
    Nodo* nuevo = new Nodo(v);
    if (head == nullptr) return nuevo;
    Nodo* actual = head;
    while (actual->next != nullptr) actual = actual->next;
    actual->next = nuevo;
    return head;
}`},{t:"ex",id:"m04-e2",title:"Eliminar todas las apariciones",desc:"Escribí `Nodo* eliminar(Nodo* head, int v)`: elimina (y libera con `delete`) **todos** los nodos con valor `v` y devuelve la nueva cabeza. Cuidado con los repetidos al principio.",pre:W,starter:`Nodo* eliminar(Nodo* head, int v) {
    // TU CÓDIGO ACÁ
    return head;
}`,tests:[{main:`Nodo* l = buildList({1, 2, 3, 2, 4});
    l = eliminar(l, 2);
    printList(l);
    freeList(l);`,expected:"1 -> 3 -> 4"},{main:`Nodo* l = buildList({5, 5, 1, 5});
    l = eliminar(l, 5);
    printList(l);
    freeList(l);`,expected:"1"},{main:`Nodo* l = buildList({3, 3});
    l = eliminar(l, 3);
    cout << (l == nullptr);`,expected:"1",hidden:!0},{main:`Nodo* l = buildList({1, 2});
    l = eliminar(l, 9);
    printList(l);
    freeList(l);`,expected:"1 -> 2",hidden:!0}],hints:["Primero un `while` que borre mientras la **cabeza** valga `v`.","Después recorré con `actual` mirando `actual->next`: si vale `v`, puentealo y `delete`; si no, avanzá."],solution:`Nodo* eliminar(Nodo* head, int v) {
    while (head != nullptr && head->valor == v) {
        Nodo* t = head;
        head = head->next;
        delete t;
    }
    Nodo* actual = head;
    while (actual != nullptr && actual->next != nullptr) {
        if (actual->next->valor == v) {
            Nodo* t = actual->next;
            actual->next = t->next;
            delete t;
        } else {
            actual = actual->next;
        }
    }
    return head;
}`},{t:"ex",id:"m04-e3",title:"Invertir la lista (iterativo)",desc:"Escribí `Nodo* invertir(Nodo* head)` que invierta la lista **in place** (sin `new`, reutilizando los nodos) y devuelva la nueva cabeza.",pre:W,starter:`Nodo* invertir(Nodo* head) {

        Nodo(const T& v, int p) : valor(v), prioridad(p), proximo(nullptr) {}

        for (Nodo* c = cabeza; c; c = c->proximo) {
            cout << c->valor << ":" << c->prioridad;
            if (c->proximo) cout << " ";
        }
        cout << "\\n";

    int* d;
    int cap;
    int frente;      // índice del primer elemento
    int cant;        // cuántos hay
public:
    ColaCircular(int c) : d(new int[c]), cap(c), frente(0), cant(0) {}
    ~ColaCircular() { delete[] d; }
    bool encolar(int v) {
        if (cant == cap) return false;                 // llena
        d[(frente + cant) % cap] = v;                  // "da la vuelta" con %
        cant++;
        return true;
    }
    bool desencolar(int& out) {
        if (cant == 0) return false;                   // vacía
        out = d[frente];
        frente = (frente + 1) % cap;
        cant--;
        return true;
    }
};
int main() {
    ColaCircular q(3);
    q.encolar(1); q.encolar(2); q.encolar(3);
    cout << q.encolar(4) << endl;      // llena: false
    int x;
    q.desencolar(x);                   // sale el 1: queda lugar en la posición 0
    cout << x << " ";
    q.encolar(4);                      // va a la posición (1+2)%3 = 0
    while (q.desencolar(x)) cout << x << " ";
    cout << endl;
}`,note:'Fijate cómo el 4 se guarda en la posición <strong>0</strong> del arreglo, que había quedado libre. Ese es el "circular": el índice se calcula con <code>%</code>.'},{t:"h2",id:"s3",text:"3. Resolver problemas usando solo la interfaz (con auxiliares)"},{t:"p",text:"Este es **el tipo de ejercicio del examen**: te piden reordenar una pila o una cola pero solo podés usar las operaciones públicas y estructuras auxiliares (otras pilas/colas). No podés recorrer `next`. La técnica es siempre **vaciar a una auxiliar y volver a armar**, y hay que dibujar en qué orden queda cada cosa."},{t:"note",kind:"key",title:"Lo que tenés que memorizar",items:["**Pila → pila**: pasar elementos de una pila a otra **invierte** el orden (lo que estaba abajo queda arriba). Pasarlos **dos veces** lo restaura.","**Cola → cola**: pasar elementos de una cola a otra **mantiene** el orden (FIFO).","**Cola → pila → cola**: **invierte** la cola.","Para saber cuántos elementos mover usá `size()` **antes** de empezar (no vuelvas a llamarlo si va cambiando).","Sacar un elemento siempre son **dos pasos**: `x = top()/front();` y después `pop()/dequeue();`."]},{t:"live",title:"Ejemplo 5 — invertir una pila con una auxiliar",code:ce+`

bool balanceado(const char* s) {
    Stack<char> st;
    for (const char* p = s; *p; p++) {
        char c = *p;
        if (c == '(' || c == '[') st.push(c);
        else if (c == ')' || c == ']') {

            if ((c == ')' && o != '(') || (c == ']' && o != '[')) return false;

int evaluar(const char* e) {

class Cola {
    struct Nodo {
        T valor;
        Nodo* proximo;
        Nodo(const T& v) : valor(v), proximo(nullptr) {}
    };
    Nodo* frente;
    Nodo* final;
public:
    Cola() : frente(nullptr), final(nullptr) {}
    ~Cola() { while (frente) { Nodo* t = frente; frente = frente->proximo; delete t; } }
    void encolar(const T& v) {
        Nodo* n = new Nodo(v);
        if (final) final->proximo = n; else frente = n;
        final = n;
    }
    void mostrar() const {
        for (Nodo* c = frente; c; c = c->proximo) cout << c->valor << " ";
        cout << endl;
    }
    bool promover(const T& valor) {
        if (frente == nullptr) return false;             // vacía
        if (frente->valor == valor) return true;         // ya está al frente
        Nodo* anterior = frente;
        Nodo* actual = frente->proximo;
        while (actual != nullptr && actual->valor != valor) {
            anterior = actual;                           // avanzan en tándem
            actual = actual->proximo;
        }
        if (actual == nullptr) return false;             // no está
        anterior->proximo = actual->proximo;             // bypass: lo desconecto
        if (actual == final) final = anterior;           // era el último: 'final' retrocede
        actual->proximo = frente;                        // trasplante: lo pongo delante
        frente = actual;
        return true;
    }
};
int main() {
    Cola<int> c;
    for (int v : {10, 20, 30, 40}) c.encolar(v);
    cout << c.promover(30) << " ";
    c.mostrar();
    cout << c.promover(40) << " ";
    c.mostrar();
    c.encolar(50);                                       // ¿final quedó bien?
    c.mostrar();
}`,note:"Tres diferencias según dónde está el nodo: en el <strong>medio</strong> alcanza con el bypass; si era el <strong>último</strong> hay que mover también <code>final</code> (el <code>promover(40)</code> lo prueba: después de eso <code>encolar(50)</code> tiene que colgarse bien); si ya estaba al <strong>frente</strong> no se hace nada."},{t:"mcq",id:"m05-q2",q:"Si `promover` mueve el **último** nodo de una cola al frente y no actualiza `m_back`, ¿qué pasa después con el siguiente `enqueue`?",opts:["Funciona bien","`m_back` sigue apuntando al nodo que ahora está al frente: el nuevo nodo se cuelga de él y se pierden los demás nodos (o se forma un ciclo)","Se lanza `underflow_error`","Se duplica el nodo"],ans:1,why:'`m_back` tiene que ser siempre "el último nodo". Si no lo actualizás quedas con una cola corrupta. Es el invariante del que hablaba el modelo de parcial (pregunta sobre invariantes estructurales).'},{t:"h2",id:"s6",text:"6. Ejercicios"},{t:"p",text:"Están las clases `Stack<TData>` y `Queue<TData>` del examen. En los ejercicios donde el enunciado lo pide, el corrector **verifica que respetes las restricciones** (por ejemplo, que no toques `m_front`/`next` o no uses arreglos)."},{t:"h3",text:"Solo con la interfaz pública"},{t:"ex",id:"m05-e1",title:"Stack<T>::invertir() const",desc:"Implementá `Stack<TData> invertir() const`: devuelve **una nueva pila** con los elementos en orden inverso, **sin modificar la original** (por eso el `const`). Pista de la cátedra: cloná con el constructor de copia y transferí a una auxiliar. Solo operaciones públicas.",post:Me,starter:G(`    // IMPLEMENTAR

d->next)` y devolvé `head`."],["**Arreglar código con bug** (`tieneLoop`)","Comentá el bug en el lugar pedido y corregí. En Floyd: siempre verificá `fast != nullptr && fast->next != nullptr` **antes** de `fast->next->next`."],['**Método de Stack/Queue "solo operaciones públicas"**',"Sacá `size()` en una variable **antes** de empezar. Pasá a una auxiliar, pensá si **invierte** (pila) o **mantiene** (cola) el orden, y volvé a `this`. Nunca toques `m_top`, `m_front`, `->next`."],["**Cirugía en lista doble** (`moverBloque…`)","Dibujá los nodos. Listá los 4 cambios: `prev`/`next` de cada extremo movido, y **`m_head`, `m_tail`, `m_size`**. Guardá punteros a los nodos que vas a perder **antes** de pisar `next`. Casos borde: vacía, un nodo, todo el bloque = toda la lista."],['**"No crear ni destruir nodos"**',"Prohibido `new` y `delete`: solo re-enlazar punteros."],['**"Liberar los duplicados"**',"`delete` cada nodo que sacás, **después** de guardar su `next` (guardar → mover → liberar)."]]},{t:"note",kind:"tip",title:'Checklist antes de apretar "Comprobar"',items:["¿Probé con lista/cola/pila **vacía**, de **1** elemento y de **2**?","¿Actualicé `m_head`, `m_tail` y `m_size` si cambió alguno?","¿Respeté la restricción (recursión / solo API pública / sin auxiliares)?","¿Compila? (`;` faltantes, tipos de las auxiliares `Queue<TData>`, `std::size_t` en los `for`).","¿Liberé lo que creé con `new`? (En CodeRunner una fuga no siempre da error, pero en el parcial de la cátedra importa.)"]},{t:"h2",id:"s2",text:"2. Simulacro A — Modelo de parcial I"},{t:"p",text:"Tres funciones sobre listas enlazadas + dos preguntas teóricas. Tiempo sugerido: **75 minutos**."},{t:"timer",minutes:75,label:"Simulacro A"},{t:"progress",label:"Avance Simulacro A",ids:["sim-a1","sim-a2","sim-a3","sim-a4","sim-a5"]},de(ye,"m03-e28","sim-a1",{title:"P1 — Compresión de logs de implantes"}),de(xe,"m04-e6","sim-a2",{title:"P2 — Detección de loop en red neural"}),de(ye,"m03-e27","sim-a3",{title:"P3 — Validaci
