<style>
/* Layout: una consola de estudio — barra de modos arriba, una tarjeta de trabajo por vez, código siempre en mono sobre papel frío */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#E9EDF3; --line:#D5DCE6;
  --ink:#16202E; --muted:#5A6678; --accent:#2B54D6; --accent-ink:#FFFFFF; --accent-soft:#E3EAFD;
  --ok:#1D7A4C; --ok-soft:#DDF2E6; --bad:#B4322A; --bad-soft:#F9E1DE; --warn:#9A6200; --warn-soft:#FBEFD5;
  --code-bg:#F7F8FB; --kw:#7A2EB8; --str:#1D7A4C; --num:#B4532A; --com:#7C8798; --typ:#2B54D6;
  --display:"Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141C; --surface:#161D28; --sunk:#1D2633; --line:#2A3546;
  --ink:#E6EBF2; --muted:#94A0B3; --accent:#7D9BFF; --accent-ink:#0F141C; --accent-soft:#1F2B4A;
  --ok:#5BD093; --ok-soft:#163327; --bad:#FF8A80; --bad-soft:#3A1D1C; --warn:#F2C26B; --warn-soft:#3A2E14;
  --code-bg:#121821; --kw:#D19BFF; --str:#7FD8A6; --num:#FFAE80; --com:#6F7C90; --typ:#8FB0FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141C; --surface:#161D28; --sunk:#1D2633; --line:#2A3546;
  --ink:#E6EBF2; --muted:#94A0B3; --accent:#7D9BFF; --accent-ink:#0F141C; --accent-soft:#1F2B4A;
  --ok:#5BD093; --ok-soft:#163327; --bad:#FF8A80; --bad-soft:#3A1D1C; --warn:#F2C26B; --warn-soft:#3A2E14;
  --code-bg:#121821; --kw:#D19BFF; --str:#7FD8A6; --num:#FFAE80; --com:#6F7C90; --typ:#8FB0FF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px}
.brand{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;padding:6px 11px;border-radius:7px}
nav.tabs a:hover{background:var(--sunk);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--surface)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;letter-spacing:-.01em;margin:0}
h1{font-size:30px;font-weight:800;line-height:1.15}
h2{font-size:22px;font-weight:800}
h3{font-size:16px;font-weight:600;font-family:var(--body)}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.view{padding-top:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.muted{color:var(--muted)}
code,.mono{font-family:var(--mono);font-size:.92em}
:not(pre)>code{background:var(--sunk);padding:1px 5px;border-radius:4px;color:var(--kw)}
pre.code{font-family:var(--mono);font-size:13px;line-height:1.55;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0;overflow-x:auto;white-space:pre;tab-size:4}
.tk-kw{color:var(--kw);font-weight:500}.tk-str{color:var(--str)}.tk-num{color:var(--num)}.tk-com{color:var(--com);font-style:italic}.tk-typ{color:var(--typ)}
button,.btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;line-height:1.2}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.07)}
button.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);letter-spacing:.02em}
.tag.src{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.bad{background:var(--bad-soft);color:var(--bad)}
/* opciones */
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:400;line-height:1.45}
.opt .l{font-family:var(--mono);font-weight:600;color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{opacity:1;cursor:default}
.feedback{border-radius:8px;padding:14px 16px;border-left:4px solid}
.feedback.ok{background:var(--ok-soft);border-color:var(--ok)}
.feedback.bad{background:var(--bad-soft);border-color:var(--bad)}
.feedback.info{background:var(--accent-soft);border-color:var(--accent)}
.feedback h3{margin-bottom:4px}
/* home */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-decoration:none;color:var(--ink)}
.mode:hover{border-color:var(--accent)}
.mode b{font-family:var(--display);font-size:17px;font-weight:600}
.mode span{color:var(--muted);font-size:13.5px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;font-size:14px}
.bar .track{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:99px}
.bar .num{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:520px){.bar{grid-template-columns:1fr 60px}.bar .track{grid-column:1 / -1;grid-row:2}}
.plan{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
/* código */
.split{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
@media (max-width:800px){.split{grid-template-columns:1fr}}
.split>*{min-width:0}
.list{display:flex;flex-direction:column;gap:4px}
.list button{text-align:left;display:flex;flex-direction:column;gap:2px;border-color:transparent;background:transparent;padding:8px 10px}
.list button:hover{background:var(--sunk)}
.list button[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.list .t{font-weight:500;font-size:14px}
.list .s{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.part{background:var(--warn)}.dot.bad{background:var(--bad)}
textarea.editor{width:100%;min-height:380px;font-family:var(--mono);font-size:13px;line-height:1.55;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px 14px;resize:vertical;tab-size:4;white-space:pre;overflow:auto}
textarea.editor:focus{outline:2px solid var(--accent);outline-offset:-1px}
.tests{width:100%;border-collapse:collapse;font-size:13px}
.tests th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.tests td{font-family:var(--mono);font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:pre-wrap;word-break:break-word}
.scroll{overflow-x:auto}
.statement p+p{margin-top:8px}
details{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details>summary{cursor:pointer;padding:10px 14px;font-weight:500}
details>div{padding:0 14px 14px}
input[type=text],select{font:inherit;font-family:var(--mono);font-size:14px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;padding:6px 12px;border:1px solid var(--bad);color:var(--bad);border-radius:6px;background:var(--surface)}
.sim-q{display:grid;grid-template-columns:130px 1fr;gap:14px}
@media (max-width:640px){.sim-q{grid-template-columns:1fr}}
.sim-q>*{min-width:0}
.qinfo{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12.5px;align-self:start}
.qinfo b{font-size:14px}
.qbody{background:var(--accent-soft);border-radius:10px;padding:18px}
.score-big{font-family:var(--display);font-size:46px;font-weight:800;line-height:1}
table.cheat{width:100%;border-collapse:collapse;font-size:13.5px}
table.cheat th,table.cheat td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
table.cheat th{font-size:12px;color:var(--muted);font-weight:600}
table.cheat td.c{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.hl-bad{color:var(--bad);font-weight:600}.hl-ok{color:var(--ok);font-weight:600}
.ai-out{white-space:pre-wrap}
.edwrap{position:relative;background:var(--code-bg);border-radius:8px}
.edwrap pre.ed-hl{position:absolute;inset:0;margin:0;overflow:hidden;pointer-events:none;font-family:var(--mono);font-size:13px;line-height:1.55;padding:13px 15px;white-space:pre;tab-size:4;color:var(--ink)}
.edwrap textarea.editor{position:relative;display:block;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--ink)}
.edwrap textarea.editor::selection{background:var(--accent-soft)}
.tk-fn{color:#0E7C86}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tk-fn{color:#5FD4DC}}
:root[data-theme="dark"] .tk-fn{color:#5FD4DC}
a.btn{text-decoration:none;display:inline-block}
.counter{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .18s ease-out}@keyframes f{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>

<script>
/* ============ DATOS ============ */
const TOPICS = {
  cpp:{n:"Fundamentos de C++"},
  bigo:{n:"Complejidad (Big O)"},
  arr:{n:"Arreglo dinámico"},
  listas:{n:"Listas (SLL / DLL)"},
  pc:{n:"Pilas y colas"}
};

const MCQ = [
// ---- de los exámenes ----
{id:"r1",t:"listas",src:"Simulacro recup",q:"La lista de solicitudes pendientes de HubFlow es una <b>SLL con referencias <code>head</code> y <code>tail</code></b>. ¿Qué par de operaciones se puede implementar en <b>O(1) en el peor caso</b>, sin recorrer la lista?",
 ok:"Insertar al final y eliminar el primer nodo.",bad:["Eliminar el último nodo y eliminar el primer nodo.","Insertar antes del último nodo y eliminar el último.","Eliminar el último nodo e insertar al final."],
 why:"Insertar al final: <code>tail->next = nuevo; tail = nuevo;</code>. Eliminar el primero: <code>head = head->next;</code>. Todo lo que toca al <b>penúltimo</b> (eliminar el último, insertar antes del último) obliga a recorrer desde head porque una SLL no tiene <code>prev</code>. Es exactamente cómo se implementa una cola."},
{id:"r2",t:"arr",src:"Simulacro recup",q:"Un arreglo dinámico inicialmente vacío crece cuando <code>size == capacity</code>. Estrategia 1: +1 posición. Estrategia 2: duplicar (desde capacidad 1). Tras N inserciones, ¿qué es correcto?",
 ok:"Estrategia 1: copias 1+2+…+(N−1) = O(N²). Estrategia 2: menos de 2N copias, O(N) total y O(1) amortizado por inserción.",bad:["Ambas tienen el mismo costo total porque cada elemento se copia una sola vez.","La estrategia 1 es O(1) amortizado y la estrategia 2 es O(N) amortizado.","La estrategia 2 siempre es más lenta porque reservar memoria extra obliga a copiar más en cada inserción."],
 why:"Con +1 se llena en cada inserción y copiás todo cada vez → suma aritmética → O(N²). Duplicando solo copiás en 1, 2, 4, 8… → suma geométrica &lt; 2N → O(N) total, O(1) amortizado."},
{id:"r3",t:"listas",src:"Simulacro recup",q:"DLL con <code>m_head</code>, <code>m_tail</code> y <code>m_size</code>: <code>A ⇄ B ⇄ C</code>. Se elimina la cabeza A. ¿Qué actualizaciones son necesarias, incluyendo el caso de lista con un único nodo?",
 ok:"m_head pasa a B, B->prev = nullptr, liberar A y decrementar m_size; si era el único nodo, m_tail = nullptr también.",bad:["Decrementar m_size sin cambiar enlaces; los punteros se actualizan solos.","Actualizar m_tail a B, poner B->prev en nullptr y liberar A.","m_head pasa a B y se libera A; B->prev puede seguir apuntando a A porque se libera igual."],
 why:"Si B->prev sigue apuntando a A después del <code>delete</code>, queda un <b>puntero colgante</b>. Y si la lista tenía un solo nodo, m_head queda en nullptr y m_tail también tiene que quedar en nullptr."},
{id:"p4",t:"listas",src:"Parcial 2026",q:"Una SLL guarda <code>head</code> y <code>tail</code>. Un desarrollador dice que, como existe <code>tail</code>, eliminar el último debería ser siempre O(1). ¿Qué explicación es correcta?",
 ok:"tail da acceso directo al último, pero para eliminarlo hay que encontrar su anterior, y una SLL no tiene enlaces hacia atrás.",bad:["Acceder al nodo apuntado por tail requiere recorrer toda la lista.","La operación delete tiene siempre complejidad O(N).","Toda eliminación sobre una SLL es O(N)."],
 why:"Llegar a tail es O(1). El problema es que después de borrarlo, el nuevo tail es el penúltimo, y para llegar a él hay que recorrer desde head: O(N). Eliminar el primero sí es O(1), por eso la D es falsa."},
{id:"p5",t:"arr",src:"Parcial 2026",q:"Un vector dinámico tiene <code>size 4, capacity 4</code>. Al insertar E reserva un bloque más grande, mueve todo y sigue. ¿Qué describe mejor la idea de <b>amortización</b>?",
 ok:"Algunas inserciones requieren una expansión costosa, pero ese costo se reparte entre muchas inserciones que no necesitan reservar memoria.",bad:["Una vez que el vector alcanza su capacidad, ya no puede almacenar nuevos elementos.","Cada inserción requiere reservar un bloque nuevo y copiar todos los elementos.","Amortizar significa reservar exactamente una posición adicional cada vez que se llena."],
 why:"Amortizado = costo total / cantidad de operaciones. Una inserción cara (O(n)) cada tanto, muchas baratas (O(1)) en el medio → promedio O(1). Reservar de a 1 es justamente lo que <b>rompe</b> la amortización."},
// ---- C++ ----
{id:"c1",t:"cpp",q:"¿Qué pasa con este código?",code:"int* p = nullptr;\n*p = 3;",
 ok:"Comportamiento indefinido: se desreferencia un puntero nulo (típicamente segmentation fault).",bad:["Guarda 3 en una variable nueva y p pasa a apuntarla.","No compila porque nullptr no se puede asignar a int*.","p pasa a valer 3."],
 why:"<code>*p</code> accede a la memoria apuntada; nullptr no apunta a nada válido. Siempre chequeá <code>if (p != nullptr)</code> antes de usar <code>p-&gt;</code> o <code>*p</code>."},
{id:"c2",t:"cpp",q:"¿Cuál es una diferencia correcta entre <b>puntero</b> y <b>referencia</b>?",
 ok:"Una referencia debe inicializarse y no puede volver a referir a otro objeto; un puntero puede ser nullptr y cambiar a dónde apunta.",bad:["Una referencia guarda una copia del objeto; el puntero guarda la dirección.","Los punteros solo sirven para memoria dinámica; las referencias solo para variables locales.","Son idénticos, solo cambia la sintaxis."],
 why:"<code>int&amp; r = a;</code> es un <b>alias</b> de a para siempre. <code>int* p = &amp;a;</code> guarda la dirección y después podés hacer <code>p = &amp;b;</code> o <code>p = nullptr;</code>."},
{id:"c3",t:"cpp",q:"Reservaste <code>int* v = new int[10];</code>. ¿Cómo se libera correctamente?",
 ok:"delete[] v;",bad:["delete v;","free(v);","No hace falta, se libera al salir de la función."],
 why:"Lo que se reserva con <code>new[]</code> se libera con <code>delete[]</code>; lo de <code>new</code> con <code>delete</code>. Mezclarlos es comportamiento indefinido. La memoria del heap <b>no</b> se libera sola."},
{id:"c4",t:"cpp",q:"¿Qué es una <b>fuga de memoria</b> (memory leak)?",
 ok:"Perder el último puntero a memoria reservada con new sin haber hecho delete.",bad:["Acceder a una posición fuera del arreglo.","Hacer delete dos veces sobre el mismo puntero.","Usar una variable local después de que terminó la función."],
 why:"Ejemplo clásico: en un <code>pop()</code> hacer <code>m_top = m_top-&gt;next;</code> sin guardar el nodo viejo y borrarlo. El nodo queda reservado y nadie lo puede liberar. Las otras opciones son otros errores (fuera de rango, doble delete, puntero colgante)."},
{id:"c5",t:"cpp",q:"¿Por qué los métodos reciben <code>const TData&amp; valor</code> en lugar de <code>TData valor</code>?",
 ok:"Para evitar copiar el objeto y a la vez garantizar que el método no lo modifique.",bad:["Para poder modificar el valor original desde el método.","Porque los templates no aceptan parámetros por valor.","Para que el parámetro se guarde en el heap."],
 why:"Por referencia = no hay copia (importa si TData es grande). El <code>const</code> prohíbe modificarlo. Por valor también funcionaría, pero copia."},
{id:"c6",t:"cpp",q:"En <code>int rachaMaxima(const TData&amp; valor) const</code>, ¿qué implica el <code>const</code> del final?",
 ok:"El método no puede modificar el objeto: no puede llamar a pop()/push() sobre *this ni cambiar atributos; por eso se trabaja sobre una copia.",bad:["Que el valor devuelto no se puede modificar.","Que el método solo puede llamarse una vez.","Que valor se pasa por copia."],
 why:"Dentro de un método const, <code>this</code> es <code>const Stack*</code>: solo podés llamar a otros métodos const (top, size, isEmpty). Para recorrer la pila hacés <code>Stack copia(*this);</code> y desarmás la copia."},
{id:"c7",t:"cpp",q:"Una clase con nodos dinámicos <b>no</b> define constructor de copia. ¿Qué pasa al hacer <code>Stack b = a;</code>?",
 ok:"Copia superficial: b copia el puntero m_top, ambos comparten los mismos nodos y al destruirse se hace doble delete.",bad:["Se copian todos los nodos automáticamente (copia profunda).","No compila: toda clase con punteros exige constructor de copia.","b queda vacía."],
 why:"El constructor de copia por defecto copia miembro a miembro: copia la <b>dirección</b>, no los nodos. Por eso las clases del parcial definen <code>Stack(const Stack&amp; other)</code> copiando nodo por nodo, o lo borran con <code>= delete</code>."},
{id:"c8",t:"cpp",q:"Después de <code>delete p;</code>, ¿en qué estado queda <code>p</code>?",
 ok:"Sigue guardando la misma dirección, pero ya no es válida (puntero colgante). Conviene ponerlo en nullptr si se sigue usando.",bad:["Pasa a valer nullptr automáticamente.","Apunta a una copia del valor borrado.","Ya no existe como variable."],

/* ---- clases base (como en el parcial) ---- */
const STACK_BASE = `template <typename TData>
class Stack {
private:
    struct Node {
        TData data;
        Node* next;
        Node(const TData& value, Node* following = nullptr)
            : data(value), next(following) {}
    };
    Node* m_top;
    int m_size;
    static Node* copyNodes(const Node* source) {
        if (source == nullptr) return nullptr;
        return new Node(source->data, copyNodes(source->next));
    }
public:
    Stack() : m_top(nullptr), m_size(0) {}
    Stack(const Stack& other)
        : m_top(copyNodes(other.m_top)), m_size(other.m_size) {}
    Stack& operator=(const Stack&) = delete;
    ~Stack() { while (!isEmpty()) pop(); }
    void push(const TData& value) {
        m_top = new Node(value, m_top);
        ++m_size;
    }
    void pop() {
        if (isEmpty()) return;
        Node* removed = m_top;
        m_top = m_top->next;
        delete removed;
        --m_size;
    }
    TData top() const { return isEmpty() ? TData() : m_top->data; }
    bool isEmpty() const { return m_size == 0; }
    int size() const { return m_size; }

@@
};`;
const QUEUE_BASE = `template <typename TData>
class Queue {
private:
    struct Node {
        TData data;
        Node* next;
        Node(const TData& value) : data(value), next(nullptr) {}
    };
    Node* m_front;
    Node* m_rear;
    int m_size;
public:
    Queue() : m_front(nullptr), m_rear(nullptr), m_size(0) {}
    Queue(const Queue&) = delete;
    Queue& operator=(const Queue&) = delete;
    ~Queue() { while (!isEmpty()) dequeue(); }
    void enqueue(const TData& value) {
        Node* nuevo = new Node(value);
        if (isEmpty()) {
            m_front = nuevo;
            m_rear = nuevo;
        } else {
            m_rear->next = nuevo;
            m_rear = nuevo;
        }
        ++m_size;
    }
    void dequeue() {
        if (isEmpty()) return;
        Node* borrar = m_front;
        m_front = m_front->next;
        delete borrar;
        --m_size;
        if (m_size == 0) m_rear = nullptr;
    }
    TData front() const { return isEmpty() ? TData() : m_front->data; }
    bool isEmpty() const { return m_size == 0; }
    int size() const { return m_size; }

@@
};`;
const DLL_BASE = `template <typename TData>
class DLL {
private:
    struct Node {
        TData data;
        Node* prev;
        Node* next;
        Node(const TData& value)
            : data(value), prev(nullptr), next(nullptr) {}
    };
    Node* m_head;
    Node* m_tail;
    int m_size;
public:
    DLL() : m_head(nullptr), m_tail(nullptr), m_size(0) {}
    ~DLL() {
        Node* actual = m_head;
        while (actual != nullptr) {
            Node* siguiente = actual->next;
            delete actual;
            actual = siguiente;
        }
    }
    void pushBack(const TData& value) {
        Node* nuevo = new Node(value);
        if (m_tail == nullptr) {
            m_head = nuevo;
            m_tail = nuevo;
        } else {
            nuevo->prev = m_tail;
            m_tail->next = nuevo;
            m_tail = nuevo;
        }
        m_size++;
    }
    bool isEmpty() const { return m_size == 0; }
    int size() const { return m_size; }

@@
};`;

public:
    SLL() : m_head(nullptr), m_tail(nullptr), m_size(0) {}
    ~SLL() {
        while (m_head != nullptr) {
            Node* sig = m_head->next;
            delete m_head;
            m_head = sig;
        }
    }
    void pushBack(const TData& value) {
        Node* nuevo = new Node(value);
        if (m_tail == nullptr) { m_head = m_tail = nuevo; }
        else { m_tail->next = nuevo; m_tail = nuevo; }
        m_size++;
    }
    void pushFront(const TData& value) {
        m_head = new Node(value, m_head);
        if (m_tail == nullptr) m_tail = m_head;
        m_size++;
    }
    bool isEmpty() const { return m_size == 0; }
    int size() const { return m_size; }

@@
};`;

 sol:`    int contar(const TData& valor) {
        int c = 0;
        int n = size();
        for (int i = 0; i < n; i++) {
            TData x = front();
            dequeue();
            if (x == valor) c++;
            enqueue(x);          // vuelve al final: rotación completa

        bool borrado = false;

        for (int i = 0; i < n; i++) {

 sol:`    TData fondo() const {
        if (isEmpty()) return TData();
        Stack copia(*this);
        while (copia.size() > 1) copia.pop();
        return copia.top();
    }

    void moverTopeAlFondo() {
        if (size() < 2) return;
        TData t = top();
        pop();
        Stack aux;
        while (!isEmpty()) { aux.push(top()); pop(); }   // invierte

 sol:`bool balanceado(const string& s) {
    Stack<char> p;

            p.push(c);
        } else if (c == ')' || c == ']' || c == '}') {

        }
    }

 sk:mk(QUEUE_BASE,[stub("void rotar(int k)","")]),
 tests:[["Queue<int> q; for(int i=1;i<=5;i++) q.enqueue(i);\nq.rotar(2); while(!q.isEmpty()){cout<<q.front(); q.dequeue();}","34512"],["Queue<int> q; for(int i=1;i<=3;i++) q.enqueue(i);\nq.rotar(7); while(!q.isEmpty()){cout<<q.front(); q.dequeue();}","231"],["Queue<int> q;\nq.rotar(3); cout<<q.size();","0"]],
 hint:"Chequeá vacía antes del módulo (dividir por 0). Después k veces: <code>enqueue(front()); dequeue();</code>",
 sol:`    void rotar(int k) {
        if (isEmpty()) return;
        k = k % size();
        for (int i = 0; i < k; i++) {
            enqueue(front());
            dequeue();
        }
    }`},
{id:"e14",t:"arr",title:"DynArray: pushBack duplicando",
 st:`Implementá <code>pushBack(valor)</code> en un arreglo dinámico. Si <code>m_size == m_capacity</code>, la capacidad se duplica (si era 0, pasa a 1): reservá un bloque nuevo, copiá, liberá el viejo con <code>delete[]</code>. Sin STL.`,
 sk:mk(DYN_BASE,[stub("void pushBack(const TData& valor)","")]),
 tests:[["DynArray<int> v; for(int i=0;i<5;i++) v.pushBack(i*10);\ncout<<v.size()<<\" \"<<v.capacity()<<\" \"<<v.get(4);","5 8 40"],["DynArray<int> v; v.pushBack(7);\ncout<<v.size()<<\" \"<<v.capacity()<<\" \"<<v.get(0);","1 1 7"]],
 hint:"<code>int nc = (m_capacity == 0) ? 1 : m_capacity * 2;</code> → <code>new TData[nc]</code> → for copiando → <code>delete[] m_data</code> → reasignar. Después <code>m_data[m_size++] = valor;</code>",
 sol:`    void pushBack(const TData& valor) {
        if (m_size == m_capacity) {
            int nc = (m_capacity == 0) ? 1 : m_capacity * 2;
            TData* nuevo = new TData[nc];
            for (int i = 0; i < m_size; i++) nuevo[i] = m_data[i];
            delete[] m_data;
            m_data = nuevo;
            m_capacity = nc;
        }
        m_data[m_size] = valor;
        m_size++;
    }`},
{id:"e15",t:"cpp",title:"Punteros: intercambiar y duplicar arreglo",
 st:`Funciones libres:<p><code>void intercambiar(int* a, int* b)</code>: intercambia los valores apuntados.</p><p><code>int* duplicados(const int* v, int n)</code>: devuelve un arreglo <b>nuevo</b> en el heap con cada elemento multiplicado por 2. Quien llama lo libera con <code>delete[]</code>.</p>`,
 sk:`void intercambiar(int* a, int* b) {\n    // IMPLEMENTAR\n}\n\nint* duplicados(const int* v, int n) {\n    // IMPLEMENTAR\n    return nullptr;\n}`,
 tests:[["int x=1, y=2; intercambiar(&x,&y);\ncout<<x<<y;","21"],["int a[]={1,2,3}; int* d=duplicados(a,3);\ncout<<d[0]<<d[1]<<d[2]<<a[0]; delete[] d;","2461"]],
 hint:"Para intercambiar necesitás una variable temporal con <code>*a</code>. Para duplicar: <code>int* r = new int[n];</code> y un for.",
 sol:`void intercambiar(int* a, int* b) {
    int tmp = *a;
    *a = *b;
    *b = tmp;
}

int* duplicados(const int* v, int n) {
    int* r = new int[n];
    for (int i = 0; i < n; i++) r[i] = v[i] * 2;
    return r;
}`}
];

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const KW = /\b(template|typename|class|struct|private|public|const|return|if|else|while|for|new|delete|void|bool|int|char|static|nullptr|true|false|operator|auto|string|cout|this)\b/;
function hl(code){
  const re = /(\/\/[^\n]*)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(\d+)\b|\b(template|typename|class|struct|private|public|const|return|if|else|while|for|new|delete|static|operator|auto|this)\b|\b(void|bool|int|char|nullptr|true|false|TData|Node|Stack|Queue|DLL|SLL|DynArray|string|cout)\b|\b([A-Za-z_]\w*)(?=\s*\()/g;
  let out = "", last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? "com" : m[2] ? "str" : m[3] ? "num" : m[4] ? "kw" : m[5] ? "typ" : "fn";
    out += `<span class="tk-${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
const pre = c => `<pre class="code">${hl(c)}</pre>`;
function attachHL(ta){
  const w = document.createElement("div"); w.className = "edwrap";
  ta.parentNode.insertBefore(w, ta);
  const p = document.createElement("pre"); p.className = "ed-hl"; p.setAttribute("aria-hidden", "true");
  w.appendChild(p); w.appendChild(ta);
  const sync = () => { p.scrollTop = ta.scrollTop; p.scrollLeft = ta.scrollLeft; };
  const up = () => { p.innerHTML = hl(ta.value) + "\n "; sync(); };
  ta.addEventListener("input", up); ta.addEventListener("keyup", up); ta.addEventListener("scroll", sync);
  ta._hl = up; up();
}
const norm = s => String(s).trim().replace(/\s+/g, " ");
function aiErr(e){
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled" || c === "capability_disabled" || c === "not_declared") { sample = null; return "Claude no está disponible en esta vista. Usá las pruebas y la solución para autocorregirte."; }

  if (c === "invalid_json") return "La respuesta vino mal formada. Probá otra vez.";
  if (c === "cancelled") return "Cancelado.";
  return "No se pudo contactar a Claude. Probá otra vez.";
}

const T = {topic:"all", onlyWrong:false, cur:null, opts:null, answered:false, streak:0, seen:[]};
function pickMCQ(){
  let pool = allMCQ().filter(q => T.topic === "all" || q.t === T.topic);
  if (T.onlyWrong) { const w = pool.filter(q => S.mcq[q.id] && !S.mcq[q.id].last); if (w.length) pool = w; else T.onlyWrong = false; }
  const recent = T.seen.slice(-Math.min(6, Math.floor(pool.length / 2)));
  const cands = pool.filter(q => !recent.includes(q.id));
  const list = cands.length ? cands : pool;
  const weight = q => { const st = S.mcq[q.id]; if (!st) return 4; return st.last ? 1 : 6; };
  let total = list.reduce((s,q) => s + weight(q), 0), r = Math.random() * total;
  for (const q of list) { r -= weight(q); if (r <= 0) return q; }
  return list[0];
}
function nextMCQ(){
  T.cur = pickMCQ(); T.seen.push(T.cur.id); T.answered = false;
  T.opts = shuffle([{txt:T.cur.ok, ok:true}].concat(T.cur.bad.map(b => ({txt:b, ok:false}))));
}

function answerMCQ(i){

Respondé SOLO un array JSON de 5 objetos: [{"q":"enunciado","code":"","ok":"opción correcta","bad":["incorrecta 1","incorrecta 2","incorrecta 3"],"why":"explicación breve de por qué es la correcta y por qué fallan las otras"}]`, {modelTier:"default", cache:false});

const ESTR = [
{k:"stack", n:"Pila", full:"Pila (Stack)", idea:"LIFO: el último que entra es el primero que sale. Solo ves y tocás el **tope**. Por dentro es una SLL donde `m_top` es la cabeza.", dib:"m_top\n  ↓\n [3] → [2] → [1] → nullptr\n último en entrar     primero en entrar", ops:[
{f:"push(x)", que:"Mete x arriba", c:"O(1)", pasos:["Crear un nodo nuevo cuyo `next` es el tope actual.","El tope pasa a ser el nodo nuevo.","Sumar 1 a `m_size`."], code:`void push(const TData& value) {
    m_top = new Node(value, m_top);  // nuevo -> viejo tope
    ++m_size;
}`},
{f:"pop()", que:"Saca el de arriba", c:"O(1)", pasos:["Si está vacía, no hacer nada.","Guardar el tope en un auxiliar (si no, lo perdés: fuga de memoria).","Mover `m_top` al siguiente.","`delete` del auxiliar y restar 1 a `m_size`."], code:`void pop() {
    if (isEmpty()) return;
    Node* removed = m_top;     // 1. guardar
    m_top = m_top->next;       // 2. mover
    delete removed;            // 3. liberar
    --m_size;
}`},
{f:"top()", que:"Mira el de arriba sin sacarlo", c:"O(1)", pasos:["Si está vacía, devolver `TData()` (valor por defecto).","Si no, devolver el dato del tope."], code:`TData top() const {
    return isEmpty() ? TData() : m_top->data;
}`},
{f:"isEmpty() / size()", que:"¿Está vacía? / ¿Cuántos hay?", c:"O(1)", pasos:["Se leen de `m_size`, que se mantiene actualizado en push y pop."], code:`bool isEmpty() const { return m_size == 0; }
int size() const { return m_size; }`}
], uso:"Para recorrerla sin romperla: si el método es `const`, hacés `Stack copia(*this);` y desarmás la copia. Si no es const, pasás todo a un aux y lo devolvés (doble inversión = orden original)."},
{k:"queue", n:"Cola", full:"Cola (Queue)", idea:"FIFO: el primero que entra es el primero que sale. Se entra por **atrás** (`m_rear`) y se sale por **adelante** (`m_front`).", dib:"m_front                m_rear\n  ↓                      ↓\n [1] → [2] → [3] → [4] → nullptr\n sale por acá       entra por acá", ops:[
{f:"enqueue(x)", que:"Mete x al final", c:"O(1)", pasos:["Crear el nodo nuevo.","Si la cola está vacía: `m_front` y `m_rear` apuntan al nuevo.","Si no: el último actual apunta al nuevo, y el nuevo pasa a ser `m_rear`.","Sumar 1 a `m_size`."], code:`void enqueue(const TData& value) {
    Node* nuevo = new Node(value);
    if (isEmpty()) {
        m_front = nuevo;
        m_rear = nuevo;
    } else {
        m_rear->next = nuevo;   // engancho atrás
        m_rear = nuevo;
    }
    ++m_size;
}`},
{f:"dequeue()", que:"Saca el del frente", c:"O(1)", pasos:["Si está vacía, no hacer nada.","Guardar el frente y mover `m_front` al siguiente.","`delete` del viejo frente y restar 1.","Si quedó vacía, `m_rear = nullptr` (si no, queda colgando)."], code:`void dequeue() {
    if (isEmpty()) return;
    Node* borrar = m_front;
    m_front = m_front->next;
    delete borrar;
    --m_size;
    if (m_size == 0) m_rear = nullptr;  // ¡no olvidar!
}`},
{f:"front()", que:"Mira el del frente sin sacarlo", c:"O(1)", pasos:["Vacía → `TData()`. Si no, el dato de `m_front`."], code:`TData front() const {
